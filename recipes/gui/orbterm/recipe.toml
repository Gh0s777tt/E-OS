[source]
# E-OS vendored mirror of redox-os/orbterm (edit freely; sync via scripts/sync-forks.sh).
git = "https://github.com/Gh0s777tt/eos-orbterm.git"
branch = "master"
rev = "8ac498177e0913034ab8e1879e1127c2034eed30"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/share/ui"
cp -rv "${COOKBOOK_SOURCE}/apps" "${COOKBOOK_STAGE}/usr/share/ui/apps"

cookbook_cargo
"""

[package]
dependencies = [
    "orbital"
]

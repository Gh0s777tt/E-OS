[source]
# Tracks upstream redox-os/orbital. (The U-030 SBOM pin was only needed against the
# June forks; the July fork rebase resolved the drift, so orbital is unpinned again —
# verified reaching the graphical E-OS greeter on aarch64.)
git = "https://gitlab.redox-os.org/redox-os/orbital.git"

[build]
template = "cargo"

[package]
dependencies = [
    "orbdata"
]

[source]
git = "https://gitlab.redox-os.org/redox-os/orbutils.git"
# E-OS U-030 follow-up: pin to the 0.1.0-SBOM-validated rev (same upstream-drift
# class as redoxfs/orbital — the launcher/greeter must match the June forks).
# Re-evaluate when the forks rebase onto upstream.
rev = "46b6d063c66b9bacdc6bfba215257c98b9b7dd44"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/share/ui"
cp -rv "${COOKBOOK_SOURCE}/apps" "${COOKBOOK_STAGE}/usr/share/ui/apps"

COOKBOOK_CARGO_PATH="orbutils" cookbook_cargo
COOKBOOK_CARGO_PATH="launcher" cookbook_cargo
"""

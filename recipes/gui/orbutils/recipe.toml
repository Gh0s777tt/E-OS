[source]
# E-OS vendored mirror of redox-os/orbutils (edit freely; sync via scripts/sync-forks.sh).
git = "https://github.com/Gh0s777tt/eos-orbutils.git"
branch = "master"
rev = "8ad7cd8fa8cfa85641261a3a0c44eb992e984952"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/share/ui"
cp -rv "${COOKBOOK_SOURCE}/apps" "${COOKBOOK_STAGE}/usr/share/ui/apps"
mkdir -pv "${COOKBOOK_STAGE}/usr/share/icons/status"
cp -v "${COOKBOOK_SOURCE}/status/"*.png "${COOKBOOK_STAGE}/usr/share/icons/status/"

COOKBOOK_CARGO_PATH="orbutils" cookbook_cargo
COOKBOOK_CARGO_PATH="launcher" cookbook_cargo
"""

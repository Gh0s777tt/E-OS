[source]
# E-OS R-401e revert: the kernel sched_yield/signal x0 fix (eos-kernel @ 97ca1607) is the
# proper root fix for the aarch64 verify() abort, so relibc is back on strict upstream.
# Pinned to the same upstream base the (now-retired) eos-relibc verify() fork branched from.
git = "https://gitlab.redox-os.org/redox-os/relibc.git"
branch = "master"
rev = "bcc1a0d43c44919d2e52c8cadcf8d335fd5e46f0"

[build]
template = "custom"
script = """
# rustup workaround https://github.com/rust-lang/rustup/issues/988
if [ "${COOKBOOK_HOST_SYSROOT}" = "/usr" ]; then
if command -v rustup >/dev/null 2>&1; then
    pushd ${COOKBOOK_SOURCE}
    ${RUSTUP:-rustup} install
    popd
fi
fi

export CARGO=${CARGO:-env -u CARGO cargo}
"${COOKBOOK_MAKE}" \
    -C "${COOKBOOK_SOURCE}" \
    -j"${COOKBOOK_MAKE_JOBS}" \
    DESTDIR="${COOKBOOK_STAGE}/usr" \
    install
"""

[source]
# E-OS R-402a: aarch64 static-TLS layout / TLSDESC / TPOFF fix (thread-exit crashes in any
# thread-spawning program, displaced .tdata initializers, broken dlopen TLS). Rebased onto
# current redox-os/relibc mainline (July). Upstream: https://gitlab.redox-os.org/redox-os/relibc.git
git = "https://github.com/Gh0s777tt/eos-relibc.git"
branch = "eos-july"
rev = "963b8f91544d061ea2fc267892ce8ca91857d6a1"

[build]
template = "custom"
script = """
# rustup workaround https://github.com/rust-lang/rustup/issues/988
if [ "${COOKBOOK_HOST_SYSROOT}" = "/usr" ]; then
if command -v rustup >/dev/null 2>&1; then
    pushd ${COOKBOOK_SOURCE}
    ${RUSTUP:-rustup} install
    popd
fi
fi

export CARGO=${CARGO:-env -u CARGO cargo}
"${COOKBOOK_MAKE}" \
    -C "${COOKBOOK_SOURCE}" \
    -j"${COOKBOOK_MAKE_JOBS}" \
    DESTDIR="${COOKBOOK_STAGE}/usr" \
    install
"""

[source]
# E-OS: aarch64 verify() fix. Sys::verify() issues SYS_YIELD and aborts on a
# non-Ok result; a freshly fork+exec'd aarch64 process's first syscall returns a
# stale -1, so this aborted every shell/desktop-spawned program. Downstream fork
# of redox-os/relibc @ bcc1a0d4. Upstream: https://gitlab.redox-os.org/redox-os/relibc.git
git = "https://github.com/Gh0s777tt/eos-relibc.git"
branch = "eos"
rev = "beb934749b4744616eaf1dc9a21768b6ceb7c0c3"

[build]
template = "custom"
script = """
# rustup workaround https://github.com/rust-lang/rustup/issues/988
if [ "${COOKBOOK_HOST_SYSROOT}" = "/usr" ]; then
if command -v rustup >/dev/null 2>&1; then
    pushd ${COOKBOOK_SOURCE}
    ${RUSTUP:-rustup} install
    popd
fi
fi

export CARGO=${CARGO:-env -u CARGO cargo}
"${COOKBOOK_MAKE}" \
    -C "${COOKBOOK_SOURCE}" \
    -j"${COOKBOOK_MAKE_JOBS}" \
    DESTDIR="${COOKBOOK_STAGE}/usr" \
    install
"""

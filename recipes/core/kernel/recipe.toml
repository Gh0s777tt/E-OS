[source]
# E-OS R-401b/R-401d/R-401e: aarch64 FEAT_RNG (RNDR/RNDRRS) emulation with CPU-jitter entropy +
# shared PCIe INTx IRQ + sched_yield/signal x0 fix. Downstream fork of redox-os/kernel @ 56947e1a.
# Upstream: https://gitlab.redox-os.org/redox-os/kernel.git
git = "https://github.com/Gh0s777tt/eos-kernel.git"
branch = "master"
rev = "35bdc7d3d7a764265fad6bda19d1f9d0a9f5d9ea"

[build]
template = "custom"
script = """
make -f ${COOKBOOK_SOURCE}/Makefile
mkdir -pv "${COOKBOOK_STAGE}/usr/lib/boot"
cp -v kernel "${COOKBOOK_STAGE}/usr/lib/boot"
"""

[source]
# E-OS R-401b/R-401d/R-401e: aarch64 FEAT_RNG (RNDR/RNDRRS) emulation with CPU-jitter
# entropy + shared PCIe INTx IRQ + sched_yield/signal x0 fix + the virtual-timer-IRQ
# registration fix + the userspace-level-INTx mask/EOI deadlock fix + KERNEL_DEBUG flood gate + ACPI PL011 RXE serial-input fix. Rebased onto current
# redox-os/kernel mainline (July). Upstream: https://gitlab.redox-os.org/redox-os/kernel.git
git = "https://github.com/Gh0s777tt/eos-kernel.git"
branch = "eos-july"
rev = "c918080f13fcc2719e9ea5e6c414656c0c5a75b9"

[build]
template = "custom"
script = """
make -f ${COOKBOOK_SOURCE}/Makefile
mkdir -pv "${COOKBOOK_STAGE}/usr/lib/boot"
cp -v kernel "${COOKBOOK_STAGE}/usr/lib/boot"
"""

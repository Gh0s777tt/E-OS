[source]
# E-OS: build the red/black-themed bootloader from the local patched checkout
# (must live under /mnt/redox so it's visible inside the build container).
git = "https://github.com/Gh0s777tt/eos-bootloader.git"
branch = "eos-rebased"
rev = "87b214b5b481be7f7049fbb07cf927961b00da5b"

[build]
template = "custom"
script = """
OUTDIR="${COOKBOOK_BUILD}"
mkdir -pv "${COOKBOOK_STAGE}/usr/lib/boot"

# V2-MS02: inject the boot-verification PUBLIC key into the bootloader source and switch on
# verification. The anchor has to live inside the bootloader binary, because that binary is the
# one artefact the firmware authenticates (V2-N03) -- a key sitting next to the kernel on disk
# would simply be swapped along with it.
#
# The key file must land under source/src/, because mk/*.mk depend on
# `$(shell find $(SOURCE)/src -type f)`; anywhere else and make would answer "up to date" and
# quietly ship a bootloader carrying the PREVIOUS key. Copy only when the bytes differ, or the
# mtime bump would force a full LTO rebuild on every cook.
SBROOT="${COOKBOOK_STAGE%/recipes/*}"
BOOTPUB="${SBROOT}/build/boot-signing/boot.pub.bin"
EOS_BOOT_FEATURES=""
if [ -f "$BOOTPUB" ]
then
    [ "$(wc -c < "$BOOTPUB" | tr -d ' ')" = 32 ] || { echo "V2-MS02: boot.pub.bin must be 32 raw bytes"; exit 1; }
    cmp -s "$BOOTPUB" "${COOKBOOK_SOURCE}/src/eos-boot-verify.pub.bin" \
        || cp -v "$BOOTPUB" "${COOKBOOK_SOURCE}/src/eos-boot-verify.pub.bin"
    EOS_BOOT_FEATURES="verify-boot"
    echo "V2-MS02: boot-verification key injected -- bootloader WILL verify kernel and initfs"
else
    echo "V2-MS02: no boot key at build/boot-signing/ -- bootloader will NOT verify what it loads"
fi
export EOS_BOOT_FEATURES

function bootloader {
    export TARGET="$1"
    src="$2"
    dst="$3"
    "${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}" -f "${COOKBOOK_SOURCE}/Makefile" -C "${OUTDIR}" "${OUTDIR}/${src}"
    cp -v "${OUTDIR}/${src}" "${COOKBOOK_STAGE}/usr/lib/boot/${dst}"
}

ARCH="$(echo "${TARGET}" | cut -d - -f1)"

# Build BIOS bootloader for supported architectures
if [ "${ARCH}" == "i586" -o "${ARCH}" == "i686" -o "${ARCH}" == "x86_64" ]
then
    bootloader "x86-unknown-none" bootloader.bin bootloader.bios
    bootloader "x86-unknown-none" bootloader-live.bin bootloader-live.bios
fi

# Build UEFI bootloader for supported architectures
if [ "${ARCH}" == "aarch64" -o "${ARCH}" == "x86_64" -o "${ARCH}" == "riscv64gc" ]
then
    bootloader "${ARCH}-unknown-uefi" bootloader.efi bootloader.efi
    bootloader "${ARCH}-unknown-uefi" bootloader-live.efi bootloader-live.efi

    # V2-N03 / R-F27: sign the UEFI bootloaders for Secure Boot, IN THE STAGE, so the pkgar
    # and the whole downstream chain (blake3 -> repo.toml -> repo.toml.sig -> the ISO's ESP)
    # all carry the signed binaries. The installer builds the live ISO's ESP from THIS package
    # (fetch_bootloaders reads usr/lib/boot/bootloader-live.efi), so signing here is the only
    # place that reaches the bootloader the firmware actually loads -- signing the
    # --write-bootloader copy did nothing (U-207).
    #
    # Gated on an operator key placed off-repo at build/sb-signing/{mok.key,mok.crt} (the build
    # volume, gitignored). No key -> bootloaders stay unsigned (graceful degrade), never a
    # silent claim of signed. The key is the operator's action, like every signing key.
    # Derive the redox root from COOKBOOK_STAGE so the path is right whether cook runs nested
    # (PODMAN_BUILD=1, root at /mnt/redox) or directly (PODMAN_BUILD=0, root at /work/redox).
    SBROOT="${COOKBOOK_STAGE%/recipes/*}"
    SBKEY="${SBROOT}/build/sb-signing/mok.key"
    SBCRT="${SBROOT}/build/sb-signing/mok.crt"
    if [ -f "$SBKEY" ] && [ -f "$SBCRT" ]
    then
        command -v sbsign >/dev/null 2>&1 || { apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq sbsigntool >/dev/null 2>&1; }
        for f in bootloader.efi bootloader-live.efi
        do
            b="${COOKBOOK_STAGE}/usr/lib/boot/${f}"
            sbattach --remove "$b" >/dev/null 2>&1 || true
            sbsign --key "$SBKEY" --cert "$SBCRT" --output "${b}.signed" "$b"
            mv "${b}.signed" "$b"
            sbverify --cert "$SBCRT" "$b" >/dev/null && echo "V2-N03: signed ${f} for Secure Boot"
        done
    else
        echo "V2-N03: no Secure Boot key at build/sb-signing/ -- bootloaders left UNSIGNED"
    fi
fi
"""

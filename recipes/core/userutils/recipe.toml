[source]
# E-OS: `eos login:` console prompt. Rebased onto current redox-os/userutils mainline (July).
git = "https://gitlab.com/e-os/eos-userutils.git"
branch = "eos-july"
rev = "a43ba3e530371affbd7d39c3cb1ef81c814e63a0"

[build]
template = "custom"
script = """
DYNAMIC_INIT
cookbook_cargo
cp -rv "${COOKBOOK_SOURCE}/res" "${COOKBOOK_STAGE}/etc"
ln -s id "${COOKBOOK_STAGE}/usr/bin/whoami"
"""

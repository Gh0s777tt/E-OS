[source]
# E-OS: `eos login:` console prompt. Rebased onto current redox-os/userutils mainline (July).
git = "https://github.com/Gh0s777tt/eos-userutils.git"
branch = "eos-july"
rev = "b12240dcf7a30f6cf930646b3173340aa4157baf"

[build]
template = "custom"
script = """
DYNAMIC_INIT
cookbook_cargo
cp -rv "${COOKBOOK_SOURCE}/res" "${COOKBOOK_STAGE}/etc"
ln -s id "${COOKBOOK_STAGE}/usr/bin/whoami"
"""

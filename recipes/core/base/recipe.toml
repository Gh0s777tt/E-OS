[source]
# E-OS R-401c (nvmed INTx mode) + R-401f (pcid ACPI _PRT INTx routing -> aarch64 boots
# without acpi=off) + R-402 (virtio-rng entropy driver feeding randd's pool, plus
# virtio-core legacy INTx support so virtio works on aarch64). Downstream fork of
# redox-os/base @ 9dd6901d. Upstream: https://gitlab.redox-os.org/redox-os/base.git
git = "https://github.com/Gh0s777tt/eos-base.git"
branch = "main"
rev = "a230ef23584b551008667c1f04b0c5acdf817f93"

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
script = """
cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""

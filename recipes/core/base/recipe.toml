[source]
# E-OS R-401c (nvmed INTx mode) + R-401f (pcid ACPI _PRT INTx routing -> aarch64 boots
# without acpi=off) + virtio-core legacy INTx + dep bumps. Rebased onto current
# redox-os/base mainline (July). NOTE: the R-402 virtio-rng entropy driver is
# reverted on this branch (it deadlocked userspace on the July stack; the kernel
# R-401b jitter entropy still seeds randd) — see docs/reference/known-issues.md.
# Upstream: https://gitlab.redox-os.org/redox-os/base.git
git = "https://gitlab.com/e-os/eos-base.git"
branch = "eos-july"
# U-081: K-01 raid1d superblock validation (f00f4825) + K-06 randd seed hardening
# and pcid ACPI _PRT walk (a5cf1b0c). U-082: randd retries rdrand on carry-flag
# failure instead of trusting a possibly-zero value (dd41f1da). U-083: rtcd sets
# the aarch64 clock from the bootloader's BOOT_TIME env on ACPI boot (efc07c3e).
rev = "fc8dc3f37c548a5cdfdd4443e36e1932880bd137"

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
script = """
cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
ROLE_TAG="e-os.boot.initfs"
PAYLOAD="${COOKBOOK_STAGE}/usr/lib/boot/initfs"

# V2-MS02: sign this payload so the bootloader will load it. The bootloader verifies Ed25519
# over SHA-512(role || len_le || data) and refuses to boot what it cannot verify. Signing here,
# in the STAGE, is what makes the signature reach every medium: pkgar archives the whole stage
# directory recursively, so `<payload>.sig` becomes a package entry and rides into the live ISO,
# the installed harddrive.img and the live->disk install alike (the same reasoning as U-207,
# where signing anywhere else missed the artefact the firmware actually loads).
#
# Gated on an operator key at build/boot-signing/boot.key (off-repo, gitignored), exactly like
# the Secure Boot key. No key -> unsigned, and the bootloader is then also built WITHOUT
# verification, so the pair stays consistent instead of producing an image that cannot boot.
SBROOT="${COOKBOOK_STAGE%/recipes/*}"
BOOTKEY="${SBROOT}/build/boot-signing/boot.key"
if [ -f "$BOOTKEY" ]
then
    python3 - "$ROLE_TAG" "$PAYLOAD" "${SBROOT}/build/boot-signing/.digest" <<'PYEOF'
import hashlib, sys
tag, path, out = sys.argv[1], sys.argv[2], sys.argv[3]
data = open(path, 'rb').read()
h = hashlib.sha512()
h.update(tag.encode()); h.update(len(data).to_bytes(8, 'little')); h.update(data)
open(out, 'wb').write(h.digest())
PYEOF
    openssl pkeyutl -sign -inkey "$BOOTKEY" -rawin \
        -in "${SBROOT}/build/boot-signing/.digest" -out "${PAYLOAD}.sig"
    rm -f "${SBROOT}/build/boot-signing/.digest"
    echo "V2-MS02: signed $(basename "$PAYLOAD") ($(wc -c < "${PAYLOAD}.sig" | tr -d ' ') B)"
else
    echo "V2-MS02: no boot key at build/boot-signing/ -- $(basename "$PAYLOAD") left UNSIGNED"
fi
"""

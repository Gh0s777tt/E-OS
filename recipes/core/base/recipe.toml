[source]
# E-OS R-401c: aarch64 nvmed INTx interrupt-mode fix (no MSI on aarch64).
# Downstream fork of redox-os/base @ 9dd6901. Upstream: https://gitlab.redox-os.org/redox-os/base.git
git = "https://github.com/Gh0s777tt/eos-base.git"
branch = "main"
rev = "25d877fd2209e55b4bba7bba935c9a38b4e2e377"

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
script = """
cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""

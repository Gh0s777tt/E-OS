[source]
# E-OS vendored mirror of redox-os/redoxfs (edit freely; sync via scripts/sync-forks.sh).
git = "https://gitlab.com/e-os/eos-redoxfs.git"
branch = "master"
# What this pin carries beyond upstream redoxfs:
#   U-081  vendored cpufeatures — from_utf8_unchecked -> validated from_utf8 (UB fix)
#   R-F44  DiskCache returns the count the disk gave back, and caches only what it
#          transferred (eos-redoxfs!2) — its short-transfer guards were unreachable
#   R-F42/R-F43  truncate clears what it drops: the inline area is zeroed and the last
#          partial record is deallocated (eos-redoxfs!3)
#   R-F48  a directory split honours DirList::append and fails with ENOSPC instead of
#          losing entries (eos-redoxfs!4)
rev = "e529d63d6571e52e19f773654d0b1e73e512f794"

[build]
template = "custom"
script = """
# E-OS R-502: enable the aes crate ARMv8 hardware AES backend. The vendored
# cpufeatures patch (source/Cargo.toml) makes it autodetect on Redox via
# /scheme/sys/cpu, so it uses hardware only when the CPU has AES, software
# otherwise. --cfg aes_armv8 is inert on other arches.
export RUSTFLAGS="--cfg aes_armv8 ${RUSTFLAGS}"
# The [patch.crates-io] entry changes Cargo.lock; allow it to update.
COOKBOOK_CARGO_FLAGS=(--offline)
# Must be statically linked
cookbook_cargo
"""

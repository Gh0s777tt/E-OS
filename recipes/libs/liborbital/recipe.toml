[source]
# E-OS vendored mirror of redox-os/liborbital (edit freely; sync via scripts/sync-forks.sh).
git = "https://github.com/Gh0s777tt/eos-liborbital.git"
branch = "master"
rev = "76ba2e79ac16fbd7a37ef622108e6c60f10cebe2"

[build]
template = "custom"
script = """
DYNAMIC_STATIC_INIT
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
"${COOKBOOK_CARGO}" build --release
# other than x86_64 this will trigger error because of lacking .so files, which is fine
"${COOKBOOK_MAKE}" install HOST="${TARGET}" DESTDIR="${COOKBOOK_STAGE}" || true
"""

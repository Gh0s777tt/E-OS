 # C library for the arithmetic of complex numbers with arbitrarily high
 # precision and correct rounding of the result.

[source]
tar = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
# Pinned 2026-08-30. mpc is a build dependency of gcc13 -- the cross-compiler that produces every
# E-OS binary -- and it was the ONLY recipe of the nineteen fetching from ftp.gnu.org without a hash.
# That matters more than it looks: src/config.rs:173-180 installs a default mirror rewrite sending
# every ftp.gnu.org URL to mirrors.ocf.berkeley.edu, so the tarball is fetched from a university
# mirror this project has no relationship with, and src/cook/fetch.rs warned and carried on.
#
# Chain of trust for this value, in order:
#   1. downloaded from ftp.gnu.org directly, NOT through the mirror rewrite
#   2. sha256 = ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8, which matches the
#      value GNU publishes for mpc-1.3.1
#   3. blake3 computed with blake3 1.8.3 -- the same crate version Cargo.lock pins for the cookbook
# The mirror was also checked on the same day and served a byte-identical file, so nothing is being
# substituted today. The pin is for every other day.
blake3 = "86d083c43c08e98d4470c006a01e0df727c8ff56ddd2956b170566ba8c9a46de"
script = """
autotools_recursive_regenerate
"""

[build]
template = "custom"
dependencies = [
    "libgmp",
    "libmpfr",
]
script = """
DYNAMIC_STATIC_INIT
cookbook_configure
"""
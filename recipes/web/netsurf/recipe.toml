[source]
tar = "https://download.netsurf-browser.org/netsurf/releases/source-full/netsurf-all-3.11.tar.gz"
blake3 = "cd406668a9ed5712efac1a8685125b83626690b73bbc6cb5de82ef00e3f65087"
patches = [
    "./ipv6.patch",
    "./01_redox.patch"
]

[build]
template = "custom"
dependencies = [
    "curl",
    "expat",
    "libjpeg",
    "libpng",
    "nghttp2",
    "openssl3",
    "sdl1",
    "zlib",
    "freetype2",
    "liborbital",
    "libiconv"
]
dev-dependencies = [
    "host:gperf"
]
script = """
DYNAMIC_INIT

# Netsurf does not currently support out-of-tree builds :(
rsync -av --delete "${COOKBOOK_SOURCE}/" ./

# --- E-OS: netsurf's SDL window must not be resizable ------------------------
# libnsfb's SDL surface caches the framebuffer pointer (nsfb->ptr = the SDL
# screen surface's pixels, which on Redox is orbclient's mmap of the orbital
# window). When the window is SDL_RESIZABLE, orbclient's event pump (events())
# reacts to the resize event orbital sends on first map by calling set_size(),
# which munmaps the old 800x600x4 buffer and mmaps a new one — but libnsfb still
# holds the *old* pointer. netsurf's first plot then writes into the freed buffer
# and faults (data abort / use-after-munmap; FAR lands at a small offset inside
# the ~1.83 MB surface). Dropping SDL_RESIZABLE keeps orbclient's `resizable`
# false, so the buffer is never remapped out from under nsfb->ptr and the page
# renders. Trade-off: the netsurf window is fixed-size for now; proper resize
# needs libnsfb to re-fetch the pointer after each remap (see
# docs/design-netsurf-pie.md). Two call sites (sdl_initialise, sdl_set_geometry).
sed -i 's/SDL_SWSURFACE | SDL_RESIZABLE/SDL_SWSURFACE/g' libnsfb/src/surface/sdl.c

# --- E-OS: default homepage = the local welcome page -------------------------
# netsurf's own default is "about:welcome" (a bundled local page), but the Redox
# netsurf config overrides it to https://www.redox-os.org/. Redox networking
# (DNS/TLS/netstack) is not functional here yet, so a no-arg launch of that
# homepage just shows a blank white page. Restore the local default so clicking
# Netsurf renders a real, useful page immediately. Flip back to a web URL once
# networking works (tracked as R-D10).
sed -i 's|override NETSURF_HOMEPAGE := "https://www.redox-os.org/"|override NETSURF_HOMEPAGE := "about:welcome"|' netsurf/Makefile.config

# obscure crash from sccache if jobs number is too much
COOKBOOK_MAKE_JOBS="$(( ${COOKBOOK_MAKE_JOBS} > 8 ? 8 : ${COOKBOOK_MAKE_JOBS} ))"

export TARGET="framebuffer"
export CFLAGS="-I${PWD}/inst-${TARGET}/include"
export LDFLAGS="${LDFLAGS} -L${COOKBOOK_SYSROOT}/lib -L${PWD}/inst-${TARGET}/lib -Wl,--allow-multiple-definition -Wl,-rpath-link,${COOKBOOK_SYSROOT}/lib"
# nghttp2 is not linked for some reason
export LDFLAGS="${LDFLAGS} -lcurl -lnghttp2"
# netsurf mixes up CFLAGS for host and build
export CC="${CC} ${CPPFLAGS}"

# --- E-OS: force a position-independent executable ---------------------------
# aarch64-unknown-redox only loads PIE binaries; a plain ET_EXEC faults at load
# (data abort, ESR 0x92000047 — the "netsurf dies the instant you click it"
# symptom). netsurf-all is a tree of nested sub-makes that build static libs
# later linked into netsurf-fb, so we cannot trust CFLAGS to reach every object.
# Instead we wrap CC: *every* compile gets -fPIC and the *final* link (an
# invocation with neither -c nor -shared) gets -pie. The quoted heredoc keeps
# $@/$pie/$REALCC literal in the wrapper (expanded at wrapper run-time), so the
# recipe needs no backslashes and stays a plain TOML triple-quoted string. Drop
# this and the from-source build silently reproduces the upstream non-PIE
# prebuilt that crashes on boot. See docs/design-netsurf-pie.md for the full why.
export REALCC="${CC}"
mkdir -p "${PWD}/.pie"
cat > "${PWD}/.pie/cc" <<'PIEWRAP'
#!/bin/sh
pie=-pie
for a in "$@"; do
    [ "$a" = "-c" ] && pie=
    [ "$a" = "-shared" ] && pie=
done
exec $REALCC -fPIC $pie "$@"
PIEWRAP
chmod +x "${PWD}/.pie/cc"
export CC="${PWD}/.pie/cc"

"$COOKBOOK_MAKE" PREFIX=/usr V=1 -j"$COOKBOOK_MAKE_JOBS"
"$COOKBOOK_MAKE" DESTDIR="$COOKBOOK_STAGE" PREFIX=/usr install -j"$COOKBOOK_MAKE_JOBS"
mkdir -pv "$COOKBOOK_STAGE/usr/share/ui/apps"
cp -v "${COOKBOOK_RECIPE}/manifest" "$COOKBOOK_STAGE/usr/share/ui/apps/00_netsurf"
"""

[package]
dependencies = [
    "ca-certificates",
    "orbital",
]

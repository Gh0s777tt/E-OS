# E-OS meta-package (R-206/R-209): ships the `eos` command (info/doctor/welcome),
# the `eos-welcome` quick-start, and the /usr/share/eos/eos-release identity file.
# Source-less, files-only recipe — the myfiles pattern. Registered in config/*/eos.toml.
# NOTE: the script is a TOML *literal* string ('''), so backslashes/quotes pass
# through verbatim — no TOML escape pitfalls (a """ string chokes on \e).

[build]
template = "custom"
script = '''
mkdir -pv "${COOKBOOK_STAGE}/usr/bin" "${COOKBOOK_STAGE}/usr/share/eos"

# ---- eos-welcome : first-run quick start -----------------------------------
cat > "${COOKBOOK_STAGE}/usr/bin/eos-welcome" <<'WELCOME'
#!/usr/bin/env ion
# Plain `echo` only — keeps this ion- and sh-compatible.
echo ""
echo "  E-OS 0.1.0 Genesis — a Rust microkernel OS, built on Redox"
echo ""
echo "  Getting around"
echo "    - Desktop:    COSMIC. The launcher is on the taskbar (E-OS hex icon)."
echo "    - Apps:       Files, Text Editor, Terminal (from the COSMIC desktop)."
echo "    - Terminal:   shells are ion and nushell. Tools: git, rg, curl, vim, ssh."
echo "    - Files:      COSMIC Files; your home is /home/user"
echo ""
echo "  Install to disk"
echo "    - Launch Installer from the desktop (GUI), or run: installer_tui"
echo "    - Full-disk encryption (AES-XTS) is offered at install — recommended."
echo ""
echo "  System"
echo "    - eos info     show version, kernel and build details"
echo "    - eos doctor   quick health check"
echo ""
echo "  Accounts"
echo "    - user  (no password)     root / password   — change them after install!"
echo ""
echo "  Docs & source"
echo "    - Handbook:  https://gh0s777tt.github.io/E-OS/"
echo "    - Source:    https://github.com/Gh0s777tt/E-OS   (AGPL-3.0)"
echo ""
WELCOME
chmod 0755 "${COOKBOOK_STAGE}/usr/bin/eos-welcome"

# ---- eos : the system command ----------------------------------------------
cat > "${COOKBOOK_STAGE}/usr/bin/eos" <<'EOSCLI'
#!/usr/bin/env ion
# E-OS system command. ion `fn` + if/else-if dispatch (verified ion syntax);
# each arm uses plain builtins so it works over a bare serial console.
fn info
    echo "E-OS — a hardened Rust microkernel OS, built on Redox (AGPL-3.0)"
    if test -f /usr/share/eos/eos-release
        cat /usr/share/eos/eos-release
    end
    echo ""
    uname -a
    if test -f /usr/lib/os-release
        echo ""
        cat /usr/lib/os-release
    end
end

fn doctor
    echo "E-OS doctor — quick health check"
    echo ""
    if test -e /scheme/rand
        echo "  [ok]   entropy source (rand: scheme) present"
    else
        echo "  [WARN] rand: scheme missing — RNG may be unseeded"
    end
    if test -d /home/user
        echo "  [ok]   home /home/user present"
    else
        echo "  [WARN] /home/user missing"
    end
    if test -f /etc/hostname
        echo "  [ok]   hostname set"
    else
        echo "  [WARN] /etc/hostname missing"
    end
    echo ""
    echo "  (run 'eos info' for version and build details)"
end

fn usage
    echo "usage: eos <command>"
    echo "  info      version, kernel and build details"
    echo "  doctor    quick health check"
    echo "  welcome   the first-run quick start"
    echo "  help      this message"
end

if test $len(@args) -ge 2
    let cmd = @args[1]
    if test $cmd = "info"
        info
    else if test $cmd = "doctor"
        doctor
    else if test $cmd = "welcome"
        eos-welcome
    else if test $cmd = "help"
        usage
    else
        echo "eos: unknown command: "$cmd
        usage
    end
else
    info
end
EOSCLI
chmod 0755 "${COOKBOOK_STAGE}/usr/bin/eos"

# ---- identity file ---------------------------------------------------------
cat > "${COOKBOOK_STAGE}/usr/share/eos/eos-release" <<'RELEASE'
E-OS 0.1.0 (Genesis)
A hardened AGPL-3.0 downstream of Redox OS.
https://github.com/Gh0s777tt/E-OS
RELEASE
'''

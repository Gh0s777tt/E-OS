# gitleaks configuration for E-OS
# Extends the default ruleset; adds allowlisting for known-safe paths.
# Docs: https://github.com/gitleaks/gitleaks
#
# U-120 review note: the global [allowlist] applies to EVERY rule, so each path
# here is a deliberate blind spot — keep the list short and justified. The
# weekly guardian routine independently greps the whole tree (including these
# paths) for credentials-in-URL and key material, which compensates for the
# lockfile/build-dir exclusions below.

title = "E-OS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  # Upstream license text (contains no secrets; excluded to keep diffs quiet).
  '''licenses/Redox-OS-MIT\.txt''',
  # Build outputs — never committed (gitignored), but the CI scan walks the
  # full history where pre-gitignore snapshots may exist.
  '''(^|/)build/''',
  '''(^|/)prefix/''',
  '''(^|/)target/''',
  # Cargo lockfiles: registry checksum hex strings false-positive against the
  # generic high-entropy rules. Risk accepted: a credential embedded in a
  # git+https source URL inside a lockfile would be missed HERE — the guardian
  # grep covers that pattern tree-wide.
  '''(^|/)Cargo\.lock$''',
  # The E-OS package-signing PUBLIC key. 74 bytes, one field `pkey`, whose value is 64 hex
  # characters = 32 bytes — the size of an ed25519 PUBLIC key. A pkgar SECRET key has a different
  # shape entirely (salt, nonce and an encrypted blob; compare build/id_ed25519.toml), so this file
  # cannot be a secret by construction.
  #
  # Corroborated independently: GitHub's own secret scanning is enabled on this repository and
  # returns an empty alert list for it. gitleaks flags it on entropy alone.
  #
  # This is a deliberate blind spot of exactly one file. The value is also pinned into the image at
  # /etc/pkg/packages.toml [pubkeys.local], so a change to it is visible in two places, not one.
  '''^keys/eos-pkg-signing\.pub\.toml$''',
  # Upstream Redox's pkgar package-signing PUBLIC key, pinned so the build stops trusting a copy
  # fetched from the same host that serves the packages. Same shape as the entry above: 74 bytes,
  # one `pkey` field, 64 hex characters = 32 bytes = an ed25519 PUBLIC key. gitleaks flags it on
  # entropy alone.
  #
  # One thing is different and worth stating: this is a THIRD PARTY's public key. It is not secret
  # to us and it is not secret to upstream either -- it is published at
  # https://static.redox-os.org/pkg/id_ed25519.pub.toml for anyone to fetch.
  '''^keys/upstream-redox-pkg\.pub\.toml$''',
]

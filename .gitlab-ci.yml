# E-OS CI/CD on GitLab. GitLab is the source of truth; GitHub is a read-only
# push-mirror, and GitHub Actions is disabled account-wide (ROADMAP R-004).
#
# TWO TIERS to fit free-tier minutes (~400/mo):
#   * LIGHT (shared runners, every MR/main): secret-scan, integrity, docs-currency,
#     pin-check, rust fmt/clippy/test + cargo-deny, docs pages.  — this file, default.
#   * HEAVY (self-hosted runner, tag `eos-heavy`): full OS image build + QEMU
#     smoke test, only on tags / schedules (see `build-image`). Register your own
#     runner — see docs/operations/ci.md. Never runs on shared runners.
variables:
  # Full clone so gitleaks scans the WHOLE history, not just the last few commits.
  GIT_DEPTH: 0

stages:
  - verify
  - test
  - docs
  - release
  - build

# ─────────────────────────────  LIGHT: verify  ─────────────────────────────
secret-scan:
  stage: verify
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact -v

integrity:
  stage: verify
  image: alpine:3
  script:
    - apk add --no-cache bash git python3 grep >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/ci-integrity.sh

# Validate that every recipe pin still matches its fork tip (repos.toml is truth).
pin-check:
  stage: verify
  image: alpine:3
  script:
    - apk add --no-cache bash git python3 grep >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/eos-repos.sh pins --strict

# ── SCHEDULED: gates that need the network and the upstream repos ──────────
# These clone every fork AND its redox-os upstream, so they are far too heavy for
# every push. Run them on a schedule (Settings → CI/CD → Schedules, daily is plenty).
# They are the only thing standing between the repo-type model in CLAUDE.md §11 and
# quiet rot: U-164 found real E-OS code hiding in a repo documented as a mirror.
mirror-drift:
  stage: verify
  image: alpine:3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      allow_failure: true
  script:
    - apk add --no-cache bash git python3 grep >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/eos-mirror-drift.sh

# Advisory, not blocking: upstream moving is not our defect, but we want to learn
# that a patch stopped rebasing NOW, not at the next sync when it blocks the work.
rebase-check:
  stage: verify
  image: alpine:3
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - apk add --no-cache bash git python3 grep >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/eos-rebase-check.sh

# Keep docs in step with code: on a merge request, if E-OS source/scripts changed
# but no docs/README/CHANGELOG did, fail — unless the MR says "docs: n/a".
docs-currency:
  stage: verify
  image: alpine:3
  # R-F12: this job used to trigger ONLY on merge_request_event. There have been zero merge
  # requests in this project's history -- every commit went straight to main -- so it had
  # never executed once. A gate that has never run is not a gate, it is a file. Running it on
  # the default branch too makes it actually execute; the script already falls back to HEAD~1
  # when there is no MR diff base, so no change was needed there.
  #
  # This does NOT close R-F12. The remaining half is a process decision plus a project
  # setting (only_allow_merge_if_pipeline_succeeds), and on main a gate still runs AFTER the
  # code is published and mirrored. It moves the job from never-run to run-late.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache git bash grep >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1}"
      changed=$(git diff --name-only "$base"...HEAD || true)
      code=$(echo "$changed" | grep -E '^(tools/.*\.rs|src/.*\.rs|scripts/)' || true)
      docs=$(echo "$changed" | grep -E '^(docs/|README|CHANGELOG)' || true)
      if [ -n "$code" ] && [ -z "$docs" ]; then
        if echo "$CI_MERGE_REQUEST_DESCRIPTION" | grep -qiE 'docs: *n/a'; then
          echo "docs-currency: acknowledged (docs: n/a)"; exit 0
        fi
        echo "Public code changed but no docs/README/CHANGELOG update:"; echo "$code"
        echo "Update the relevant docs, or add 'docs: n/a' to the MR description."
        exit 1
      fi
      # Advisory (non-blocking): new public items should carry a doc-comment.
      # The hard, precise gate is crate-level missing_docs (see CLAUDE.md §3);
      # this is only a reminder, so it never fails the pipeline.
      undoc=$(git diff -U1 "$base"...HEAD -- '*.rs' | awk '
        /^\+.*\bpub (fn|struct|enum|trait|mod|const|type) / { if (prev !~ /\/\/\/|\/\/!|#\[/) print }
        { prev = $0 }' | sed "s/^+//" | head -20)
      if [ -n "$undoc" ]; then
        echo "advisory: new public item(s) without an adjacent doc-comment (///):"
        echo "$undoc"
        echo "  (reminder only — document what it does + why; see CLAUDE.md §3)"
      fi
      echo "docs-currency: OK"

# ──────────────────────────────  LIGHT: test  ──────────────────────────────
# Format, lint, unit-test and supply-chain-check the E-OS host tooling in one job
# (one compile). cargo-deny covers RustSec advisories + licenses + bans + sources,
# so a separate cargo-audit is redundant here (local-scan.sh still runs it locally).
rust-checks:
  stage: test
  image: rust:slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    M: tools/eos-repo-sign/Cargo.toml
    DENY_VER: "0.20.2"
    # U-118: cargo-deny is itself a security gate — a swapped binary could
    # silently "pass" the audit, so its release asset is SHA256-pinned.
    # Bump procedure: new version -> `curl -sfL <url> | sha256sum` -> update both.
    DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --manifest-path "$M" -- --check
    - cargo clippy --manifest-path "$M" -- -D warnings
    - cargo test --manifest-path "$M"
    # git is needed by cargo-deny to clone the RustSec advisory-db.
    - apt-get update -qq && apt-get install -y -qq curl git >/dev/null
    # Download-verify-extract (never pipe straight into tar — U-118).
    - curl -fsSL -o cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VER}/cargo-deny-${DENY_VER}-x86_64-unknown-linux-musl.tar.gz"
    - echo "${DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
    - tar xzf cargo-deny.tar.gz --strip-components=1
    - ./cargo-deny --manifest-path "$M" check
    # R-F15: the vendored redox_cookbook at the repo root is the engine that builds every
    # image, and until U-159 nothing here touched it -- its 9 unit tests had never run in
    # CI, and its dependency tree had never been audited. `check advisories` only: licences
    # and sources are upstream's choices, and gating those would be re-litigating a vendored
    # tree rather than protecting this one. fmt/clippy are likewise left off for vendored
    # code, the same reasoning that keeps ci-integrity.sh check 4 out of src/.
    - cargo test --manifest-path Cargo.toml
    - ./cargo-deny --manifest-path Cargo.toml check advisories

# R-F14: 46 tracked shell scripts had zero linting, in a project whose scripts sign
# releases, publish repositories and can delete 37 GB of build cache. Scope is scripts/ --
# E-OS-owned code. build.sh and the *_bootstrap.sh at the repo root are inherited from
# upstream Redox and recipes/wip/ is scratch; gating those would mean carrying upstream
# divergence for no safety gain, the same call CLAUDE.md 3 makes for third-party ports.
#
# Errors BLOCK. The first run over these scripts (U-159) found 3, all real and all of the
# same shape: unquoted $@ / $* and an array interpolated into a string. That shape is not
# theoretical here -- the tree lives under a path containing a space
# (/Volumes/Project itp/...), so an unquoted expansion splits a real argument.
#
# Warnings are printed but advisory: the same run found 18, and driving that to zero is
# worth doing deliberately rather than in the change that introduces the gate. It is NOT
# `|| true` on the blocking check -- this project has already learned what a decorative
# gate is worth (the gitleaks hook, U-140).
shell-lint:
  stage: test
  image:
    name: koalaman/shellcheck-alpine:v0.10.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - shellcheck --version
    - echo "--- advisory (warnings and above) ---"
    - shellcheck -f gcc -S warning scripts/*.sh || true
    - echo "--- blocking (errors only) ---"
    - shellcheck -f gcc -S error scripts/*.sh

# Coverage, gated on E-OS-OWNED code only. Measured baseline (U-168):
#   tools/eos-repo-sign  38.84% lines
#   redox_cookbook (root) 2.92% lines
# The root crate is the VENDORED upstream build engine (CLAUDE.md 11, type B). Holding it
# to an E-OS coverage bar would mean writing tests for somebody else's code and carrying
# the divergence forever, so it is reported and not gated. The floor below is set just
# under the measured value: it exists to catch a REGRESSION, not to certify 38% as good.
# Verified that it can actually fail -- at --fail-under-lines 60 this job exits non-zero.
coverage:
  stage: test
  image: rust:slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked
    - 'echo "--- advisory: vendored redox_cookbook ---"'
    - cargo llvm-cov --manifest-path Cargo.toml --summary-only || true
    - 'echo "--- blocking: E-OS-owned tools/eos-repo-sign ---"'
    - cargo llvm-cov --manifest-path tools/eos-repo-sign/Cargo.toml --summary-only --fail-under-lines 38

# SBOM for the crates E-OS builds itself. sbom/ already carries image-level documents
# (eos-<ver>-<arch>.cdx.json) but nothing regenerated them, so they aged silently. This
# produces a CycloneDX document per manifest as a pipeline artefact; signing it is R-011
# and needs a key, which is an operator action (CLAUDE.md 5).
sbom:
  stage: test
  image: rust:slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cargo install cargo-cyclonedx --locked
    - cargo cyclonedx --manifest-path tools/eos-repo-sign/Cargo.toml --format json
    - cargo cyclonedx --manifest-path Cargo.toml --format json
    - mkdir -p sbom-out && find . -name '*.cdx.json' -not -path './sbom/*' -exec cp {} sbom-out/ \;
    - ls -la sbom-out/
  artifacts:
    paths: [sbom-out/]
    expire_in: 30 days

# rustdoc for the E-OS-owned crate. Published as an artefact rather than merged into
# `pages`, which mdBook already owns; wiring the two together is a docs task, not a
# reason to leave the API undocumented in the meantime.
rustdoc:
  stage: docs
  image: rust:slim
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cargo doc --no-deps --manifest-path tools/eos-repo-sign/Cargo.toml
  artifacts:
    paths: [tools/eos-repo-sign/target/doc/]
    expire_in: 30 days

# ──────────────────────────────  LIGHT: docs  ──────────────────────────────
pages:
  stage: docs
  image: debian:stable-slim
  # Publishing the docs site is cosmetic and runs on budget-limited shared
  # runners; when free-tier minutes are exhausted it fails with
  # `stuck_pending_no_matching_runners`. Because `docs` sits before the `build`
  # stage, a hard failure here used to SKIP the heavy `build-image` OS/boot-smoke
  # job entirely. allow_failure keeps a docs hiccup from reddening the pipeline
  # or blocking OS build verification (same rationale as the QEMU fork jobs).
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    MDBOOK_VER: "0.4.40"
    MERMAID_VER: "0.14.0"
    # U-118: SHA256 pins for the release binaries (bump alongside *_VER).
    MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"
    MERMAID_SHA256: "37364965fb190cf9929d93c930c6b6c69b2fed05f7658ea2d312882ed59c645e"
  script:
    - apt-get update -qq && apt-get install -y -qq curl >/dev/null
    # Download-verify-extract (never pipe straight into tar — U-118).
    - curl -fsSL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VER}/mdbook-v${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz"
    - echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum -c -
    - tar xzf mdbook.tar.gz
    - curl -fsSL -o mdbook-mermaid.tar.gz "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VER}/mdbook-mermaid-v${MERMAID_VER}-x86_64-unknown-linux-gnu.tar.gz"
    - echo "${MERMAID_SHA256}  mdbook-mermaid.tar.gz" | sha256sum -c -
    - tar xzf mdbook-mermaid.tar.gz
    - ./mdbook-mermaid install .
    - ./mdbook build -d public
  artifacts:
    paths:
      - public

# The docs PDF is rendered from the mdBook HTML (via `print.html` → headless
# Chromium, see scripts/docs-pdf.sh — no fragile mdbook-PDF plugin) on the
# self-hosted eos-heavy runner, which has the toolchain + Chromium and spends no
# shared CI minutes. `needs: []` detaches it from stage order so a quota-exhausted
# light tier can't skip it; allow_failure keeps a docs hiccup non-blocking. Runs
# on tags + schedules (not every push). See docs/operations/ci.md.
docs-pdf:
  stage: docs
  tags: [eos-heavy]
  needs: []
  allow_failure: true
  rules:
    # U-152: `when: manual` on the tag path. These jobs need the self-hosted eos-heavy
    # runner, and no such runner is currently attached to the project, so an automatic
    # tag job sits PENDING forever and the tag's pipeline never completes --
    # `allow_failure` does not help a job that is never picked up. Manual keeps it one
    # click away for when the rig is attached, and lets a release tag produce a
    # pipeline that actually finishes. build-image-x86_64 already did exactly this;
    # docs-pdf and build-image were the two that still hung.
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK != "renovate"'
  variables:
    EOS_CONTAINER: eosbuild
    EOS_MACHINE: eos-build
  script:
    - export PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
    - podman machine start "$EOS_MACHINE" 2>/dev/null || true
    # `podman machine start` returns once the VM is LAUNCHING, not once its socket accepts
    # connections. Every scheduled run since at least 2026-08-25 died here, a tenth of a second
    # after "Starting machine":
    #     Error: unable to connect to Podman socket: ssh: handshake failed: EOF
    #     ERROR: Job failed: exit status 125
    # So the one gate that actually boots the OS has not run in over a week -- it was failing on
    # a startup race, not on anything it was meant to check. Wait for the socket instead.
    #
    # Measured on the reference host from a STOPPED machine, which is the condition that was
    # failing: `podman info` first answers after ~47 s, and the whole sequence down to
    # `podman exec <container> true` returning 0 takes ~75 s. The 120 s budget is therefore a
    # margin of about 1.6x, not a guess -- raise it with a new measurement, not by feel.
    - |
      for i in $(seq 1 60); do
        podman info >/dev/null 2>&1 && break
        if [ "$i" -eq 60 ]; then
          echo "podman machine '$EOS_MACHINE' did not accept connections within 120s" >&2
          echo "  the VM may be starting, wedged, or absent: podman machine list" >&2
          exit 1
        fi
        sleep 2
      done
    - podman start "$EOS_CONTAINER" 2>/dev/null || true
    - podman exec "$EOS_CONTAINER" true
    - podman exec "$EOS_CONTAINER" rm -rf /tmp/eos-docs
    - podman exec "$EOS_CONTAINER" mkdir -p /tmp/eos-docs
    - git archive --format=tar HEAD book.toml docs scripts | podman exec -i "$EOS_CONTAINER" tar -C /tmp/eos-docs -xf -
    - podman exec "$EOS_CONTAINER" bash -lc "cd /tmp/eos-docs && bash scripts/docs-pdf.sh public/eos-docs.pdf"
    - podman cp "$EOS_CONTAINER:/tmp/eos-docs/public/eos-docs.pdf" "eos-docs.pdf"
  artifacts:
    when: on_success
    expire_in: 1 month
    paths:
      - eos-docs.pdf

# ─────────────────────────────  LIGHT: release  ────────────────────────────
# semantic-release: derive the version from Conventional Commits, tag and cut a
# GitLab Release (it does NOT rewrite the manual U-NNN CHANGELOG.md). DORMANT until
# you set a masked, protected CI variable GITLAB_TOKEN (scope: api) — see docs/operations/ci.md.
semantic-release:
  stage: release
  image: node:20-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_TOKEN'
  script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - npx --yes -p semantic-release -p @semantic-release/gitlab semantic-release

# ─────────────────  HEAVY: full image build (self-hosted only)  ─────────────
# Runs ONLY on a runner tagged `eos-heavy` (your Mac, shell executor). The build
# happens inside the persistent podman container `eosbuild`, whose /work/redox
# tree already carries the Rust toolchain + relibc + prefix caches — so builds
# are incremental (minutes) rather than from-scratch (hours). Steps:
#   1. bring the podman machine + container up (idempotent),
#   2. sync THIS commit's tracked sources into the container via `git archive`
#      (overwrites source, preserves the untracked build/ + prefix/ caches),
#   3. `make CI=1 all` for aarch64 inside the container,
#   4. copy the image out and boot-smoke it headlessly (scripts/ci-boot-smoke.sh).
# Triggers on tags + scheduled pipelines only — never on shared runners.
build-image:
  stage: build
  tags: [eos-heavy]
  # Run independently of the shared-runner light tier. The self-hosted eos-heavy
  # runner consumes NO shared CI minutes, so when the free-tier budget is
  # exhausted (`ci_quota_exceeded` on the light jobs) this — the only
  # verification that actually boots the OS — must still run instead of being
  # skipped by the failed earlier stages. `needs: []` detaches it from stage
  # ordering. See docs/operations/ci.md (CI minutes).
  needs: []
  rules:
    # U-152: manual on the tag path -- see the note on docs-pdf. The scheduled path
    # stays automatic: that is the nightly heavy build's whole purpose, and it works
    # the moment an eos-heavy runner is attached.
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK != "renovate"'
  timeout: 6h
  variables:
    EOS_CONTAINER: eosbuild
    EOS_MACHINE: eos-build
    ARCH: aarch64
    CONFIG_NAME: eos
  script:
    - export PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"  # Homebrew podman/qemu/git
    - podman machine start "$EOS_MACHINE" 2>/dev/null || true
    # `podman machine start` returns once the VM is LAUNCHING, not once its socket accepts
    # connections. Every scheduled run since at least 2026-08-25 died here, a tenth of a second
    # after "Starting machine":
    #     Error: unable to connect to Podman socket: ssh: handshake failed: EOF
    #     ERROR: Job failed: exit status 125
    # So the one gate that actually boots the OS has not run in over a week -- it was failing on
    # a startup race, not on anything it was meant to check. Wait for the socket instead.
    #
    # Measured on the reference host from a STOPPED machine, which is the condition that was
    # failing: `podman info` first answers after ~47 s, and the whole sequence down to
    # `podman exec <container> true` returning 0 takes ~75 s. The 120 s budget is therefore a
    # margin of about 1.6x, not a guess -- raise it with a new measurement, not by feel.
    - |
      for i in $(seq 1 60); do
        podman info >/dev/null 2>&1 && break
        if [ "$i" -eq 60 ]; then
          echo "podman machine '$EOS_MACHINE' did not accept connections within 120s" >&2
          echo "  the VM may be starting, wedged, or absent: podman machine list" >&2
          exit 1
        fi
        sleep 2
      done
    - podman start "$EOS_CONTAINER" 2>/dev/null || true
    - podman exec "$EOS_CONTAINER" true            # fail fast if container unreachable
    - echo "sync $CI_COMMIT_SHORT_SHA -> $EOS_CONTAINER:/work/redox (tracked sources only)"
    - git archive --format=tar HEAD | podman exec -i "$EOS_CONTAINER" tar -C /work/redox -xf -
    # R-601a: `all` builds ONLY harddrive.img (Makefile:8), so the installation medium --
    # the artefact a person actually writes to a USB stick -- was never built here and never
    # exported. Its name carries EOS_VERSION, so it is asked for rather than typed: one home
    # for the naming rule (mk/config.mk), as with scripts/make-release.sh.
    - MEDIUM=$(podman exec "$EOS_CONTAINER" bash -lc "cd /work/redox && make -s print-installer-medium ARCH=$ARCH CONFIG_NAME=$CONFIG_NAME")
    - echo "medium is $MEDIUM"
    - podman exec "$EOS_CONTAINER" bash -lc "cd /work/redox && make CI=1 ARCH=$ARCH CONFIG_NAME=$CONFIG_NAME all $MEDIUM"
    - podman cp "$EOS_CONTAINER:/work/redox/build/$ARCH/$CONFIG_NAME/harddrive.img" "harddrive-$ARCH.img"
    - podman cp "$EOS_CONTAINER:/work/redox/$MEDIUM" "$(basename "$MEDIUM")"
    # R-611c: same script eos-build.sh calls -- one implementation, two callers.
    - bash scripts/eos-esp-add-cert.sh "$(basename "$MEDIUM")"
    - bash scripts/ci-boot-smoke.sh "harddrive-$ARCH.img" 420
    # R-601b: boot the MEDIUM, drive the installer onto a blank disk, boot the result. This
    # is a different and much stronger claim than booting a pre-installed image, and it is
    # the only job in this file that exercises the installer at all.
    - bash scripts/ci-boot-smoke.sh "$(basename "$MEDIUM")" 420
    # ci-install-smoke.sh copies the source image (~1.4 GiB) and creates a 4 GiB target, so it
    # needs ~6 GiB of scratch. The runner's default TMPDIR is on the boot volume, measured
    # 2026-09-01 at 3.7 GiB free, and the harness refused -- correctly, with exit 2 and the
    # remedy in the message rather than a mangled "test failure":
    #     install-smoke: FAIL (instrument) -- ... has 3811 MiB free
    #                    Point the scratch directory somewhere with room: EOS_SMOKE_WORK=/path
    # /Volumes/EOS-Podman is the external disk that already carries the podman machine (233 GiB
    # free on the same date). If it is not mounted, say so instead of failing later on space.
    - |
      SMOKE_ROOT="${EOS_SMOKE_ROOT:-/Volumes/EOS-Podman}"
      if [ ! -d "$SMOKE_ROOT" ]; then
        echo "install-smoke scratch volume '$SMOKE_ROOT' is not mounted" >&2
        echo "  mount it, or set EOS_SMOKE_ROOT to a path with at least 6 GiB free" >&2
        exit 1
      fi
      mkdir -p "$SMOKE_ROOT/ci-smoke"
      export EOS_SMOKE_WORK="$SMOKE_ROOT/ci-smoke"
    - bash scripts/ci-install-smoke.sh "$(basename "$MEDIUM")" 2400 --arch "$ARCH"
    # SBOM (R-302): regenerate from THIS build's cooked package metadata (real
    # blake3 + source revs), deterministic via the commit timestamp, then export it.
    - podman exec "$EOS_CONTAINER" bash -lc "cd /work/redox && python3 scripts/gen-sbom.py --repo-dir repo/$ARCH-unknown-redox --target $ARCH-unknown-redox --eos-commit $CI_COMMIT_SHA --timestamp $CI_COMMIT_TIMESTAMP --out sbom/eos-$ARCH.cdx.json"
    - podman cp "$EOS_CONTAINER:/work/redox/sbom/eos-$ARCH.cdx.json" "sbom-$ARCH.cdx.json"
    # Publish what identifies the images, not the images. Measured 2026-09-01: the job
    # verified everything it exists to verify -- build, sign, esp-cert with its negative
    # control, boot-smoke on both the installed disk and the medium, and install-smoke
    # PASS through to booting the installed disk -- and then reported FAILED, because
    # uploading two 1.4 GiB images exceeds the 1 GiB per-job artifact cap:
    #     ERROR: Uploading artifacts as "archive" to coordinator... error  (x3)
    #     FATAL: invalid argument
    # A green verification that reports red is worse than no artifact at all: it hides the
    # result it was run to produce. The images stay on the runner in ~/eos-artifacts.
    # Publishing the medium as a downloadable artifact is #4 (R-601a) and needs a decision
    # about HOW -- compressed, tag-only, or a release asset -- not a bigger paths list.
    - |
      for f in harddrive-aarch64.img eos-*-aarch64-installer.img; do
        [ -f "$f" ] && shasum -a 256 "$f"
      done > sha256sums-aarch64.txt
      cat sha256sums-aarch64.txt
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - sha256sums-aarch64.txt
      - sbom-aarch64.cdx.json

# x86_64 image — cross-compiles in the same container, but a full x86_64 boot on
# Apple Silicon runs under TCG (slow/flaky), so this is MANUAL and non-blocking.
# Trigger it from the pipeline UI, or move it to a dedicated x86_64 `eos-heavy`
# runner (your separate x86 rig) for a native boot-smoke. See docs/operations/ci.md.
build-image-x86_64:
  stage: build
  tags: [eos-heavy]
  needs: []            # independent of the shared-runner light tier (see build-image)
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK != "renovate"'
      when: manual
      allow_failure: true
  timeout: 6h
  variables:
    EOS_CONTAINER: eosbuild
    EOS_MACHINE: eos-build
  script:
    - export PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
    - podman machine start "$EOS_MACHINE" 2>/dev/null || true
    # `podman machine start` returns once the VM is LAUNCHING, not once its socket accepts
    # connections. Every scheduled run since at least 2026-08-25 died here, a tenth of a second
    # after "Starting machine":
    #     Error: unable to connect to Podman socket: ssh: handshake failed: EOF
    #     ERROR: Job failed: exit status 125
    # So the one gate that actually boots the OS has not run in over a week -- it was failing on
    # a startup race, not on anything it was meant to check. Wait for the socket instead.
    #
    # Measured on the reference host from a STOPPED machine, which is the condition that was
    # failing: `podman info` first answers after ~47 s, and the whole sequence down to
    # `podman exec <container> true` returning 0 takes ~75 s. The 120 s budget is therefore a
    # margin of about 1.6x, not a guess -- raise it with a new measurement, not by feel.
    - |
      for i in $(seq 1 60); do
        podman info >/dev/null 2>&1 && break
        if [ "$i" -eq 60 ]; then
          echo "podman machine '$EOS_MACHINE' did not accept connections within 120s" >&2
          echo "  the VM may be starting, wedged, or absent: podman machine list" >&2
          exit 1
        fi
        sleep 2
      done
    - podman start "$EOS_CONTAINER" 2>/dev/null || true
    - podman exec "$EOS_CONTAINER" true
    - git archive --format=tar HEAD | podman exec -i "$EOS_CONTAINER" tar -C /work/redox -xf -
    - MEDIUM=$(podman exec "$EOS_CONTAINER" bash -lc "cd /work/redox && make -s print-installer-medium ARCH=x86_64 CONFIG_NAME=eos")
    - echo "medium is $MEDIUM"
    - podman exec "$EOS_CONTAINER" bash -lc "cd /work/redox && make CI=1 ARCH=x86_64 CONFIG_NAME=eos all $MEDIUM"
    - podman cp "$EOS_CONTAINER:/work/redox/build/x86_64/eos/harddrive.img" "harddrive-x86_64.img"
    - podman cp "$EOS_CONTAINER:/work/redox/$MEDIUM" "$(basename "$MEDIUM")"
    # R-611c: same script eos-build.sh calls -- one implementation, two callers.
    - bash scripts/eos-esp-add-cert.sh "$(basename "$MEDIUM")"
    # Boot-smoke was skipped here on the assumption that an x86_64 boot under TCG on
    # an Apple Silicon runner would time out. Measured 2026-08-21 (U-133): it reaches
    # `eos login:` in ~16 s, i.e. the same order as the aarch64 job. Gating on it is
    # cheap, and an image that builds but does not boot is exactly what this job
    # otherwise ships as a green artifact.
    - bash scripts/ci-boot-smoke.sh "harddrive-x86_64.img" 600 --arch x86_64
    # R-601a/R-601c: the medium boots too, and the installer runs from it. MEASURED on the
    # reference host: the medium reaches `eos login:` under TCG, and ci-install-smoke.sh
    # scales its step windows (EOS_SMOKE_SLOW) because emulation is slower than the aarch64
    # numbers those windows were taken from -- hence the larger budget here than for aarch64.
    - bash scripts/ci-boot-smoke.sh "$(basename "$MEDIUM")" 900 --arch x86_64
    # ci-install-smoke.sh copies the source image (~1.4 GiB) and creates a 4 GiB target, so it
    # needs ~6 GiB of scratch. The runner's default TMPDIR is on the boot volume, measured
    # 2026-09-01 at 3.7 GiB free, and the harness refused -- correctly, with exit 2 and the
    # remedy in the message rather than a mangled "test failure":
    #     install-smoke: FAIL (instrument) -- ... has 3811 MiB free
    #                    Point the scratch directory somewhere with room: EOS_SMOKE_WORK=/path
    # /Volumes/EOS-Podman is the external disk that already carries the podman machine (233 GiB
    # free on the same date). If it is not mounted, say so instead of failing later on space.
    - |
      SMOKE_ROOT="${EOS_SMOKE_ROOT:-/Volumes/EOS-Podman}"
      if [ ! -d "$SMOKE_ROOT" ]; then
        echo "install-smoke scratch volume '$SMOKE_ROOT' is not mounted" >&2
        echo "  mount it, or set EOS_SMOKE_ROOT to a path with at least 6 GiB free" >&2
        exit 1
      fi
      mkdir -p "$SMOKE_ROOT/ci-smoke"
      export EOS_SMOKE_WORK="$SMOKE_ROOT/ci-smoke"
    - bash scripts/ci-install-smoke.sh "$(basename "$MEDIUM")" 5400 --arch x86_64
    # Same reason as the aarch64 job above: two 1.4 GiB images do not fit a 1 GiB cap, and
    # a failed upload turns a green verification red. This job is manual and has never run,
    # so this is corrected here rather than discovered the first time someone triggers it.
    - |
      for f in harddrive-x86_64.img eos-*-x86_64-installer.img; do
        [ -f "$f" ] && shasum -a 256 "$f"
      done > sha256sums-x86_64.txt
      cat sha256sums-x86_64.txt
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - sha256sums-x86_64.txt

# ──────────────────  Renovate (scheduled dependency updates)  ───────────────
# Self-hosted Renovate opens MRs for dependency bumps (replaces Dependabot).
# DORMANT until you add a scheduled pipeline + a masked CI variable RENOVATE_TOKEN
# (a GitLab PAT, scope: api). See docs/operations/ci.md.
renovate:
  stage: verify
  image: renovate/renovate:slim
  # A dependency-bump bot must NEVER block the OS pipeline, and must only fire on
  # its OWN schedule (SCHEDULE_TASK=renovate) — not on the heavy-build schedule.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "renovate" && $RENOVATE_TOKEN'
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "https://gitlab.com/api/v4/"
    RENOVATE_TOKEN: "$RENOVATE_TOKEN"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "e-os/e-os"
  script:
    - renovate

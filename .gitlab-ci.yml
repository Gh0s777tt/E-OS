# E-OS lightweight CI on GitLab. GitLab is the source of truth; GitHub is a
# read-only push-mirror, and GitHub Actions is disabled account-wide (ROADMAP
# R-004), so these fast integrity/secret gates run here on every push to GitLab.
# Kept deliberately light to fit free-tier shared-runner minutes; the heavy OS
# image build belongs on a self-hosted runner.
variables:
  # Full clone so gitleaks scans the WHOLE history, not just the last few commits.
  GIT_DEPTH: 0

stages:
  - verify
  - docs

secret-scan:
  stage: verify
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact -v

integrity:
  stage: verify
  image: alpine:3
  script:
    - apk add --no-cache bash grep git >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/ci-integrity.sh

# Keep docs in step with code: on a merge request, if E-OS source/scripts changed
# but no docs/README/CHANGELOG did, fail — unless the MR says "docs: n/a".
docs-currency:
  stage: verify
  image: alpine:3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - apk add --no-cache git bash >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1}"
      changed=$(git diff --name-only "$base"...HEAD || true)
      code=$(echo "$changed" | grep -E '^(tools/.*\.rs|src/.*\.rs|scripts/)' || true)
      docs=$(echo "$changed" | grep -E '^(docs/|README|CHANGELOG)' || true)
      if [ -n "$code" ] && [ -z "$docs" ]; then
        if echo "$CI_MERGE_REQUEST_DESCRIPTION" | grep -qiE 'docs: *n/a'; then
          echo "docs-currency: acknowledged (docs: n/a)"; exit 0
        fi
        echo "Public code changed but no docs/README/CHANGELOG update:"; echo "$code"
        echo "Update the relevant docs, or add 'docs: n/a' to the MR description."
        exit 1
      fi
      echo "docs-currency: OK"

# Build the mdBook and publish it to GitLab Pages (docs live at the Pages URL,
# linked from the README). Uses prebuilt binaries — no cargo compile — to stay
# cheap on free-tier minutes. Only on the default branch.
pages:
  stage: docs
  image: debian:stable-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    MDBOOK_VER: "0.4.40"
    MERMAID_VER: "0.14.0"
  script:
    - apt-get update -qq && apt-get install -y -qq curl >/dev/null
    - curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VER}/mdbook-v${MDBOOK_VER}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
    - curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MERMAID_VER}/mdbook-mermaid-v${MERMAID_VER}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
    - ./mdbook-mermaid install .
    - ./mdbook build -d public
  artifacts:
    paths:
      - public

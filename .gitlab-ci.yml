# E-OS lightweight CI on GitLab. GitHub Actions is disabled account-wide
# (ROADMAP R-004), so these fast integrity/secret gates run here instead — on
# every push mirrored from GitHub. Kept deliberately light to fit free-tier
# shared-runner minutes; the heavy OS image build belongs on a self-hosted runner.
stages:
  - verify

secret-scan:
  stage: verify
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact -v

integrity:
  stage: verify
  image: alpine:3
  script:
    - apk add --no-cache bash grep git >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/ci-integrity.sh

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  E-OS — desktop build configuration                                    ║
# ║  Full COSMIC desktop, rebranded as E-OS (a downstream of Redox OS).    ║
# ║  Build:  make CI=1 CONFIG_NAME=eos all   then   make CONFIG_NAME=eos qemu ║
# ╚══════════════════════════════════════════════════════════════════════╝

include = ["../desktop.toml"]

[general]
# Room for E-OS branding + the richer desktop app set below.
filesystem_size = 1400

# ────────────────────────────  E-OS packages  ────────────────────────────
# R-206: the `eos` meta-package ships /usr/bin/eos-welcome (quick start) and
# /usr/share/eos/eos-release. Recipe: recipes/other/eos.
#
# R-207 (usable desktop): the base desktop.toml ships only edit/files/term +
# netsurf. E-OS adds a practical CLI toolbox so a fresh install is usable out of
# the box. (The extra COSMIC apps — store/settings/reader — are deferred; see the
# note by [packages] below.)
[packages]
eos = {}

# COSMIC desktop apps: cosmic-store/settings/reader deferred — their cookbook
# build pulls fontconfig, which needs the gperf host tool (recipes/wip) that the
# REPO_BINARY resolver does not auto-build. Follow-up. The base desktop.toml
# still ships cosmic-edit/files/term.

# CLI toolbox
nano = {}              # beginner-friendly editor
vim = {}               # modal editor
git = {}               # version control
curl = {}              # HTTP client
wget = {}              # downloader
ripgrep = {}           # fast recursive search (rg)
nushell = {}           # modern structured shell
openssh = {}           # ssh client/server

# ────────────────────────────  E-OS identity  ────────────────────────────
# NOTE: postinstall = true is REQUIRED — without it these files are written
# BEFORE packages are installed, so the base/userutils packages overwrite them.
# postinstall writes them AFTER packages, so E-OS branding wins.

# Hostname → shown as the login prompt ("eos login:")
[[files]]
path = "/etc/hostname"
postinstall = true
data = "eos"

# /usr/lib/os-release (/etc/os-release is a symlink to it) — overrides Redox's.
[[files]]
path = "/usr/lib/os-release"
postinstall = true
data = """
PRETTY_NAME="E-OS 0.1.0 (Genesis)"
NAME="E-OS"
VERSION="0.1.0 (Genesis)"
VERSION_ID="0.1.0"
VERSION_CODENAME=genesis
ID=eos
ID_LIKE=redox-os
ANSI_COLOR="1;31"
HOME_URL="https://github.com/Gh0s777tt/E-OS"
DOCUMENTATION_URL="https://github.com/Gh0s777tt/E-OS/tree/main/docs"
SUPPORT_URL="https://github.com/Gh0s777tt/E-OS/issues"
BUG_REPORT_URL="https://github.com/Gh0s777tt/E-OS/issues"
"""

# Login banner (/etc/issue) — overrides userutils' default Redox banner.
[[files]]
path = "/etc/issue"
postinstall = true
data = """

     #####  #####  #####
     #      #   #  #
     ####   #   #  #####
     #      #   #      #
     #####  #####  #####

  E-OS 0.1.0 "Genesis"  -  a Rust microkernel OS
  built on Redox * AGPL-3.0 * github.com/Gh0s777tt/E-OS

  Login:  user  (no password)   *   root / password

"""

# Message of the day (printed by login) — points at the eos-welcome quick start.
[[files]]
path = "/etc/motd"
postinstall = true
data = """
Welcome to E-OS - forged in Rust.  https://github.com/Gh0s777tt/E-OS
Type  eos-welcome  for a quick start.
"""

# First thing a desktop user sees in COSMIC Files (same pattern as demo.toml).
[[files]]
path = "/home/user/Welcome.txt"
postinstall = true
data = """
Welcome to E-OS 0.1.0 "Genesis" — a Rust microkernel OS, built on Redox.

Quick start: open a terminal and run  eos-welcome

  - Install to disk:  launch "Installer" from the desktop (optional full-disk
    encryption is offered during install — recommended).
  - Accounts:  user (no password)  *  root / password  — change them after install!
  - Handbook:  https://gh0s777tt.github.io/E-OS/
  - Source:    https://github.com/Gh0s777tt/E-OS  (AGPL-3.0)
"""

# ───────────────────────────  E-OS R-402: e1000e NIC  ───────────────────────────
# QEMU's default q35 NIC is the Intel 82574L (e1000e, 8086:10D3), which the stock
# e1000d pcid map does not claim -- so default-q35 networking binds no driver.
# Verified 2026-06-18 (live boot): with this id mapped, e1000d binds and initialises
# the 82574L (BARs + IRQ). Shipped as a /usr/lib/pcid.d overlay so it survives a
# drivers-package refresh.
[[files]]
path = "/usr/lib/pcid.d/e1000e.toml"
postinstall = true
data = """
[[drivers]]
name = "Intel e1000e (82574L)"
class = 0x02
ids = { 0x8086 = [0x10D3] }
command = ["e1000d"]
"""

# Wayland configuration
#
# ⚠️ UNUSED — EXPERIMENTAL. Nothing builds this config. The default is
# `CONFIG_NAME?=desktop` (mk/config.mk:20) and CI pins `CONFIG_NAME: eos`
# (.gitlab-ci.yml:222); no Makefile, script or job references `wayland.toml`.
# It is the only *config* in the tree that names `cosmic-comp`; the only other
# declaration is its recipe, which still opens with
# "#TODO: performance issues, no keyboard input"
# (recipes/wip/wayland/cosmic-comp/recipe.toml) and lives under recipes/**wip**/.
# The shipping session is orbital + eos-orbutils with COSMIC apps as clients —
# see docs/known-issues.md. Kept as a starting point for a future Wayland
# session; do NOT cite it as evidence that E-OS runs a COSMIC compositor.

include = ["desktop.toml"]

# Override the default settings here

# General settings
[general]
# Filesystem size in MiB
filesystem_size = 2048

# Package settings
[packages]
adwaita-icon-theme = {}
bash = {}
cosmic-app-library = {}
cosmic-comp = {}
gtk3 = {}
libcosmic-wayland = {}
libxcursor = {}
iced-wayland = {}
mesa = {}
"pop-icon-theme.cursors" = {}
smallvil = {}
softbuffer-wayland = {}
wayland-rs = {}
#webkitgtk3 = {}
winit-wayland = {}
xkeyboard-config = {}

# Overridden to launch wayland compositor instead of orblogin
[[files]]
path = "/usr/lib/init.d/20_orbital"
data = """
requires_weak 10_net.target 20_audiod.service
nowait BROWSER=/bin/netsurf-fb VT=3 orbital orbital-wayland
"""

[[files]]
path = "/usr/bin/orbital-wayland"
mode = 0o755
data = """
#!/usr/bin/env bash

set -ex

# Prepare environment
unset DISPLAY
export COSMIC_BACKEND=winit
export HOME=/root
export LD_DEBUG=all
export RUST_BACKTRACE=full
export RUST_LOG=debug
export XCURSOR_THEME=Pop
export XDG_RUNTIME_DIR=/tmp/run/user/0

# Create XDG runtime directory
#TODO: mkdir -p not working
mkdir -p /tmp/run
mkdir -p /tmp/run/user
mkdir -p /tmp/run/user/0

# Compile glib schemas
glib-compile-schemas /usr/share/glib-2.0/schemas/

# For cosmic-comp (more features)
cosmic-comp wayland-session

# For smallvil (easier to debug)
#smallvil -c wayland-session&
"""

[[files]]
path = "/usr/bin/wayland-session"
mode = 0o755
data = """
#!/usr/bin/env bash

set -ex

#env G_MAIN_POLL_DEBUG=1 G_MESSAGES_DEBUG=all LD_DEBUG=all WEBKIT_DEBUG=all MiniBrowser&
printenv
#wayland-rs_simple-window
#winit-wayland_window
#softbuffer-wayland_animation
#iced-wayland_sctk_lazy
libcosmic-wayland_application
#gtk3-widget-factory
#cosmic-app-library run
"""

[[files]]
path = "/etc/gtk-3.0/settings.ini"
data = """
[Settings]
gtk-cursor-theme-name = "Pop"
gtk-icon-theme-name = "Cosmic"
"""

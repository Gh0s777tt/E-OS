# Applications a person may decline while installing E-OS.
#
# WHY THIS FILE EXISTS. The owner asked that the bundled programs be "built into the system with
# the ability to enable or disable them at install". The first half is done -- all seven ship in
# the image (`PR-016`) -- and the second half needs the installer to know two things this file is
# the only place that states: WHICH applications are optional, and WHICH FILES each one owns.
#
# It is not a list of packages. Removing a package name from the image config removes it from
# every install; this is about one person, at one install, declining one application that is
# already on the medium. The fast install path clones the live filesystem wholesale (R-F24), so
# deselection is a REMOVAL after the clone, and a removal needs an exact file list -- guessing
# from a package name would leave the launcher entry behind and the icon orphaned.
#
# WHAT IS DELIBERATELY NOT HERE. `eos-control` is the settings panel: declining it would leave a
# system with no way to change its own settings, so it is not offered. `netsurf`, `cosmic-term`,
# `cosmic-files` and `cosmic-edit` are upstream applications, not E-OS products, and their removal
# is a different question with different owners.
#
# The file lists are checked against each application's recipe by integrity check 24: a recipe that
# starts installing a new file, or stops installing one, turns this file red rather than letting
# the installer delete a path that no longer exists (or leave one it never heard of).
#
# THE ICON PATHS CHANGED WITH `PR-017`, and the old ones are why. Until 2026-09-03 the recipes
# staged icons into `/usr/share/ui/icons/apps/`, which is a symlink into `/usr/share/icons` -- and
# a package extractor that refuses to write through a symlink is doing the right thing, because
# that is how a package is stopped from planting files outside its own tree. The consequence was
# silent: the icon was in the .pkgar, staged correctly, and never appeared in the image. Measured
# on a mounted copy, `find / -name "eos-*.png"` returned nothing at all. The real directory is
# named here now; the runtime path `/ui/icons/apps/x.png` still resolves to it when something
# READS it, which is why the launcher entries did not have to change.
#
# The consumer of this file must still treat a missing path as ALREADY REMOVED rather than as an
# error. Deleting something that is not there is the desired end state, not a failure -- and an
# installer that stopped on it would refuse to honour a person's choice over a file nobody sees.

[eos-notes]
title = "E-OS Notes"
summary = "Notatnik z lokalną bazą i szyfrowaniem w spoczynku."
files = [
    "/usr/bin/eos-notes",
    "/usr/share/ui/apps/30_eos-notes",
    "/usr/share/icons/apps/eos-notes.png",
]

[eos-guard]
title = "E-OS Guard"
summary = "Audyt uprawnień i integralności plików. Nie jest to antywirus."
files = [
    "/usr/bin/eos-guard",
    "/usr/share/ui/apps/40_eos-guard",
    "/usr/share/icons/apps/eos-guard.png",
]


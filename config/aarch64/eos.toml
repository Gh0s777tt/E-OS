# E-OS R-501: assemble RAID-1 mirrors (daemon exits quietly when no array).
# R-601: type MUST stay "oneshot_async", NOT "notify". init drains services on a
# single thread and blocks on a "notify" service until it signals readiness; raid1d
# signals ready only AFTER assemble() probes every /scheme/disk.* (open R+W + read the
# trailing 4 KiB superblock). On the live ISO that probe hits the physical NVMe the
# bootloader read from — whose I/O stalls waiting for an INTx IRQ that never routes on
# aarch64 (the R-401d/R-501 platform bug) — so raid1d never calls ready(), init's drain
# stalls, and 30_console (queued right after it) never spawns `getty 2`, leaving the
# text console (VT2) black on live. Nothing does `requires_weak 25_raid1d`, so init
# gains nothing by awaiting it: oneshot_async lets init spawn raid1d and move on.
[[files]]
path = "/usr/lib/init.d/25_raid1d.service"
data = """
[unit]
description = "RAID-1 mirror daemon (R-501)"
requires_weak = ["00_base.target"]

[service]
cmd = "raid1d"
type = "oneshot_async"
"""

# Serial console login: there is EXACTLY ONE getty on the kernel serial console, the
# `nowait getty /scheme/debug/no-preserve -J` in 30_console above. A second one used to be
# declared here as 30_serial-getty.service (`getty /scheme/debug`), attached to the same
# console. Removed 2026-09-02 (#24), matching the x86_64 configuration.
#
# Two gettys on one console means two `login` processes reading the same input; on x86_64 that
# cost 5 failures in 7 runs of ci-install-smoke (the second login answered the next line typed
# with "Login incorrect"). aarch64 did NOT show that symptom -- it passed with the duplicate in
# place -- so this removal is about closing a latent race, not a measured failure here. What was
# measured on aarch64, 2026-09-02: one run with the duplicate present PASSED, and one run with it
# removed PASSED too, end to end including stage 2. Serial login therefore still works with only
# 30_console's getty -- that is the one serving the console. One run each; the point being tested
# is "does serial login still work", not a failure rate.
#
# The note here also claimed that "interactive input over QEMU's macOS unix-socket serial isn't
# delivered to the guest (verified: 0 RX interrupts)". That is not true: the install-smoke
# harness drives this guest over exactly that serial console.

# ──────────────────  R-701a: do not trust the upstream package host  ──────────────────
# `config/base.toml` ships /etc/pkg.d/50_redox pointing at https://static.redox-os.org/pkg.
# Inherited from upstream, and on an E-OS image it is a hole in our own hardening: a fresh
# install would `pkg install` binaries built WITHOUT the E-OS flags (overflow-checks, W^X,
# ASLR), over a channel whose signing key pkg-lib still fetches TOFU from the very host that
# serves the packages. Overriding the same path is the established pattern here (this file
# already overrides /etc/hostname from base.toml, and desktop-contain.toml overrides
# 20_orbital the same way).
#
# The URL is COMMENTED OUT rather than the file removed, deliberately. pkg-lib's
# update_remotes() skips lines beginning with '#' (repo_manager.rs), so a comment-only file
# parses cleanly and yields zero remotes — whereas deleting the file can leave /etc/pkg.d
# absent, and its `fs::read_dir` is fallible, and an empty line would reach add_remote("")
# which fails with RepoPathInvalid. Keeping a parseable file is the graceful degrade.
#
# The E-OS source (/etc/pkg.d/50_eos) lands with R-008 once the repo is signed and published,
# and only then does R-702 pin the key. Order matters: see docs/archive/plan.md §4.
# ────────────────────  R-701: the E-OS package source  ────────────────────
# The E-OS repo, signed with the key pinned above at /etc/pkg/eos-repo-sign.pub.toml.
# Same shape as 50_redox below: pkg-lib's update_remotes() reads one URL per line and skips
# lines beginning with '#', so a comment-only file parses cleanly and yields zero remotes.
#
# SHIPPED INERT ON PURPOSE, which is the whole reason the file exists at all: the URL is NOT
# live yet. R-008 -- the first signed publish -- has not happened, and github.io returns 404
# for it today (measured, U-199). Pointing a client at a 404 would turn every `pkg` operation
# into a network error, so the line stays commented until there is something behind it.
#
# TO ENABLE, once R-008 has published: uncomment the URL, rebuild, and confirm on a booted
# image that `pkg` fetches repo.toml AND verifies repo.toml.sig against the pinned key. A
# missing or invalid signature must be FATAL (RepoManifestUnsigned / RepoManifestSigInvalid),
# not a warning -- that fail-closed path is the one thing R-702 could not demonstrate without
# a live source, so enabling this is what finally proves it. Note that check 9 in
# ci-integrity.sh rejects any active package URL in an image config; enabling this source
# means teaching that gate to tell OUR signed repo from an unauthenticated upstream one.
[[files]]
path = "/etc/pkg.d/50_eos"
data = """
# E-OS package source (R-701). Signed with the key at /etc/pkg/eos-repo-sign.pub.toml.
https://gh0s777tt.github.io/eos-pkg-aarch64/pkg
"""

[[files]]
path = "/etc/pkg.d/50_redox"
data = """
# Upstream Redox packages are NOT enabled on E-OS images (R-701a).
# These binaries are built without E-OS hardening flags and the channel is
# unauthenticated on the client until R-702/R-703 land. Uncomment only if you
# understand and accept both.
#https://static.redox-os.org/pkg
"""

# ──────────────  R-904a: no raw IP sockets in the user namespace  ──────────────
# base.toml grants the user namespace `ip` — smoltcp's RawSocket. That lets any
# unprivileged program send arbitrary IP packets: spoofed sources, crafted headers,
# and a complete bypass of any packet filter that works above the raw layer. Building
# the firewall (R-904) while this is granted would produce protection anyone can step
# around, so the removal has to come first (docs/archive/plan.md §4, step 5).
#
# `icmp` deliberately STAYS. `ping` ships in netutils and opens `icmp:echo/<host>/ttl`;
# dropping it would take ping away from ordinary users to close a hole far narrower
# than `ip`. ICMP tunnelling is still possible and belongs in the R-904 filter design,
# not in this list.
#
# Config alone is not enough: userutils' apply_login_schemes() falls back to a
# hard-coded DEFAULT_SCHEMES when this file is missing or unparseable, and that list
# also carried `ip` — a parse error silently restored raw sockets. Fixed in the same
# change (eos-userutils@a43ba3e); both halves are needed or neither holds.
[[files]]
path = "/etc/login_schemes.toml"
data = """
[user_schemes.root]
schemes = ["*"]
[user_schemes.user]
schemes = [
  # Kernel schemes
  "debug",
  "event",
  "memory",
  "pipe",
  "serio",
  "irq",
  "time",
  "sys",
  # Base schemes
  "rand",
  "null",
  "zero",
  "log",
  # Network schemes ("ip" removed — see R-904a above)
  "icmp",
  "tcp",
  "udp",
  # IPC schemes
  "shm",
  "chan",
  "uds_stream",
  "uds_dgram",
  # File schemes
  "file",
  # Display schemes
  "display.vesa",
  "display*",
  # Other schemes
  "proc",
  "pty",
  "sudo",
  "audio",
  "orbital",
]
"""

# >>> R-702 pinned repo-signing public key (managed by scripts/eos-pin-repo-key.sh) >>>
# Pinned trust anchor for the package index. pkg-lib reads this path and, once it
# exists, treats a missing or invalid repo.toml.sig as a hard error instead of a
# warning. Regenerate with scripts/eos-pin-repo-key.sh; do not hand-edit.
[[files]]
path = "/etc/pkg/eos-repo-sign.pub.toml"
mode = 0o644
data = """
# E-OS repo signing PUBLIC keys — ship with the repo/verifier.
[public_keys]
ed25519 = "719dd886e9634aa194a2105e645c176d1a626440facfd68ddc7be3990cb5cc9b"
ml_dsa_65 = ""
"""
# <<< R-702 pinned repo-signing public key <<<

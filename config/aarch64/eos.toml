# E-OS (aarch64) - desktop build configuration; a downstream of Redox OS.
# Build:  make CI=1 ARCH=aarch64 CONFIG_NAME=eos all

include = ["../desktop.toml"]

[general]
# Room for E-OS branding + the richer desktop app set below.
filesystem_size = 1400
# Target triple this filesystem is built for (U-085): a standalone installer run
# (no TARGET in the env) picks it up from here, so the ESP gets BOOTAA64.EFI —
# not the historical BOOTX64.EFI default that boots to the EFI shell.
target = "aarch64-unknown-redox"

# ── E-OS original apps ───────────────────────
# U-086: E-OS Notes — Crimson notes app (Slint + SQLite/WAL), the first E-OS
#   original application. Recipe: recipes/gui/eos-notes.
# U-089: E-OS Guard — filesystem integrity monitor (blake3 + SQLite), the second.
#   Both build on the shared eos-ui backend. Recipe: recipes/gui/eos-guard.
[packages.eos-notes]
# U-095: E-OS Control consolidates the system monitor (eos-sysmon)
# and the integrity monitor (eos-guard) into one tabbed control center.
# The standalone repos remain (archived); only eos-control ships.
[packages.eos-control]

# ────────────────────────────  E-OS packages  ────────────────────────────
# R-206: the `eos` meta-package ships /usr/bin/eos-welcome (quick start) and
# /usr/share/eos/eos-release. Recipe: recipes/other/eos.
#
# R-207 (usable desktop): the base desktop.toml ships only edit/files/term +
# netsurf. E-OS adds a practical CLI toolbox so a fresh install is usable out of
# the box. (The extra COSMIC apps — store/settings/reader — are deferred; see the
# note by [packages] below.)
[packages]
eos = {}

# COSMIC desktop apps: cosmic-store/settings/reader deferred — they pull
# fontconfig -> host:gperf, whose redoxer host toolchain is published only for
# x86_64-linux build hosts. This aarch64 (Apple Silicon) build host gets a 404;
# they build fine on an x86_64-linux host (the WSL2 rig). The base desktop.toml
# still ships cosmic-edit/files/term.

# CLI toolbox
nano = {}              # beginner-friendly editor
vim = {}               # modal editor
git = {}               # version control
curl = {}              # HTTP client
wget = {}              # downloader
ripgrep = {}           # fast recursive search (rg)
nushell = {}           # modern structured shell
openssh = {}           # ssh client/server

# ────────────────────────────  E-OS identity  ────────────────────────────
# NOTE: postinstall = true is REQUIRED — without it these files are written
# BEFORE packages are installed, so the base/userutils packages overwrite them.
# postinstall writes them AFTER packages, so E-OS branding wins.

# Hostname → shown as the login prompt ("eos login:")
[[files]]
path = "/etc/hostname"
postinstall = true
data = "eos"

# Launcher clock timezone: seconds east of UTC. 7200 = UTC+2 (Poland CEST,
# correct for the current season). A fixed offset — no DST/named-zone until a tz
# database + per-machine timezone at OOBE (R-606). Edit this value (or set a
# numeric TZ env) to relocalise the bar clock.
[[files]]
path = "/etc/tz-offset"
postinstall = true
data = "7200"

# R-F08: keep the graphical greeter (VT3) in the foreground at boot.
# minimal.toml's 30_console runs `inputd -A 2`; because desktop.toml includes
# BOTH desktop-minimal.toml and server.toml (each pulling minimal.toml), the
# installer concatenates the [[files]] entries and the `inputd -A 2` copy from
# server→minimal lands LAST, so it wins on disk and steals focus to the text
# console (VT2) after `20_orbital` activates VT3 — the desktop then needs
# Super+F3 to appear. eos.toml is merged dead-last, so this definition wins:
# the getty on VT2 stays available (reachable with Super+F2) but is no longer
# force-activated, and `requires_weak 20_orbital` orders it after the greeter.
[[files]]
path = "/usr/lib/init.d/30_console"
data = """
requires_weak 20_orbital
nowait getty 2
nowait getty /scheme/debug/no-preserve -J
"""

# /usr/lib/os-release (/etc/os-release is a symlink to it) — overrides Redox's.
[[files]]
path = "/usr/lib/os-release"
postinstall = true
data = """
PRETTY_NAME="E-OS 0.1.0 (Genesis)"
NAME="E-OS"
VERSION="0.1.0 (Genesis)"
VERSION_ID="0.1.0"
VERSION_CODENAME=genesis
ID=eos
ID_LIKE=redox-os
ANSI_COLOR="1;31"
HOME_URL="https://gitlab.com/e-os/e-os"
DOCUMENTATION_URL="https://e-os.gitlab.io/e-os/"
SUPPORT_URL="https://gitlab.com/e-os/e-os/-/issues"
BUG_REPORT_URL="https://gitlab.com/e-os/e-os/-/issues"
"""

# Login banner (/etc/issue) — overrides userutils' default Redox banner.
[[files]]
path = "/etc/issue"
postinstall = true
data = """

     #####  #####  #####
     #      #   #  #
     ####   #   #  #####
     #      #   #      #
     #####  #####  #####

  E-OS 0.1.0 "Genesis"  -  a Rust microkernel OS
  built on Redox * AGPL-3.0 * https://gitlab.com/e-os/e-os

  Accounts:  user  *  root   -   the first login makes you set a password

"""

# Message of the day (printed by login) — points at the eos-welcome quick start.
[[files]]
path = "/etc/motd"
postinstall = true
data = """
Welcome to E-OS - forged in Rust.  https://gitlab.com/e-os/e-os
Type  eos-welcome  for a quick start.
"""

# First thing a desktop user sees in COSMIC Files (same pattern as demo.toml).
[[files]]
path = "/home/user/Welcome.txt"
postinstall = true
data = """
Welcome to E-OS 0.1.0 "Genesis" — a Rust microkernel OS, built on Redox.

Quick start: open a terminal and run  eos-welcome

  - Install to disk:  launch "Installer" from the desktop (optional full-disk
    encryption is offered during install — recommended).
  - Accounts:  user  *  root  — the first login makes you set a password (OOBE).
  - Handbook:  https://e-os.gitlab.io/e-os/
  - Source:    https://gitlab.com/e-os/e-os  (AGPL-3.0; GitHub is a read-only mirror)
"""

# A starter file for the desktop-icons layer (DE Phase 3): the `desktop`
# program lists ~/Desktop entries as double-clickable icons.
[[files]]
path = "/home/user/Desktop/Welcome.txt"
postinstall = true
uid = 1000
gid = 1000
data = """
This icon lives in ~/Desktop - anything you put there shows up on the desktop.
Double-click to open; see ~/Welcome.txt for the quick start.
"""


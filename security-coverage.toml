# Security-coverage floors, read by scripts/eos-security-coverage.py.
#
# Five proxies, because a line-coverage percentage says which lines RAN, never whether the
# dangerous ones were CHECKED. Each floor is the measurement that existed when it was written.
#
#   SC-1  unsafe blocks carrying a `// SAFETY:` note ÷ all unsafe in E-OS-owned Rust
#   SC-2  parser files with a fuzz target ÷ all parser files            [needs cargo-fuzz]
#   SC-3  own crates inside cargo-deny AND osv-scanner ÷ all own crates
#   SC-4  declared inputs with a hostile-value test ÷ all declared inputs
#   SC-5  killed mutants ÷ mutants in trust code                        [needs cargo-mutants]
#
# A proxy whose tool is absent is SKIPPED and the script exits 2 — never a silent 0 %, never a
# silent 100 %. Exit 1 = a floor was crossed, fix the tree. Exit 2 = it could not run, fix the
# toolbox. Same split as `FAIL (instrument):` in ci-integrity.sh (U-177).
[floor]
# E-OS-owned Rust has zero unsafe today, so 100 % is free — and that is the point: the first
# unsafe block without a SAFETY note breaks the gate the moment it is written.
SC-1 = 100.0
# A crate outside the scanners is a crate nobody watches.
SC-3 = 100.0
# One crate has parsing code and it has a fuzz target, so the floor is what the rule means: a NEW
# crate that parses attacker-controlled bytes and ships no target turns this red the day it lands.
# Credit is per crate, not per file -- counting per file would demand a target per source file and
# reward splitting a parser in two.
SC-2 = 100.0
# The first manifest exists (TQ-007: tools/eos-repo-sign/tests/inputs.toml, four inputs), so the
# floor rises to what the rule always meant: EVERY declared input has a hostile-value test. It sat
# at 0.0 while nothing was declared, because a proxy with nothing to measure must not report a
# pass -- and 100.0 now is not a boast. It is the only honest floor for a rule of the form "every
# X has a Y": declaring an input is admitting it needs one, so the next input added without a test
# turns this red the moment it is declared.
SC-4 = 100.0
# SC-5 has no floor here on purpose: the mutation score is gated by scripts/eos-mutation-score.sh
# against mutation-floor.txt, which is the file a person edits when they raise it. Two floors for
# one number is two answers to one question.

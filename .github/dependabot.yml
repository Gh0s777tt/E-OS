version: 2
# NOTE: GitHub Actions is disabled account-wide (ROADMAP R-004) and the
# workflows were removed, so the "github-actions" ecosystem was dropped (it only
# churned PRs against a dead pipeline). Rust dep surfacing stays until Renovate
# on GitLab replaces Dependabot (ETAP 4 / R-007).
updates:
  # Rust dependencies (root workspace). Grouped to reduce PR noise.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

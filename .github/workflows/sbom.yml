# SBOM — CycloneDX + SPDX for the E-OS host tooling, on every build and on every release.
#
# WHY THIS EXISTS (C-14, security audit 2026-08-30). `sbom/` carries image documents for
# 0.1.0 only — `eos-0.1.0-aarch64.cdx.json` and `eos-0.1.0-x86_64.cdx.json` — while v0.2.0
# has been tagged and signed (`U-152`; a development milestone rather than a published
# release, but a thing that exists and has no document at all, which is the gap C-14 names
# and what the backfill dispatch below is for). The GitLab `sbom` job regenerates a document
# per manifest, but only as a pipeline artefact with `expire_in: 30 days`: a month after a
# release the document that described it is gone. And since 2026-08-28 that job has not run
# at all (`ci_quota_exceeded`, C-7). Two failures with one shape — nothing durable is
# attached to the thing that actually shipped.
#
# So this file does both halves: generate on every build (push, PR, tag) AND attach to the
# GitHub Release, which is the only storage in reach here that does not expire. Actions
# artifacts always expire — 90 days is the ceiling on a public repo — so the release asset,
# not the artifact, is what closes C-14. The artifact is for the other 99% of builds, where
# you want to diff today's dependency graph against last week's.
#
# SCOPE — read this before trusting the document. These are HOST-TOOLING SBOMs: the two
# cargo manifests plus a syft catalogue of the checked-out tree. They are NOT the image
# closure. The image SBOM comes from `scripts/gen-sbom.py`, which reads the cooked package
# metadata under `repo/<target>/` (real blake3 hashes, real source revs) after a full build;
# that needs podman and the 37 GB build cache and runs on the self-hosted `eos-heavy` runner
# (see `.gitlab-ci.yml` `build-image`). It cannot run on a GitHub runner, and this workflow
# does not pretend otherwise.
#
# Both manifests get a document, including the vendored `redox_cookbook` at the repo root.
# The owned/vendored asymmetry that governs fmt, clippy and cargo-deny in `.gitlab-ci.yml`
# does not apply here: describing what is in the tree is not a judgement on somebody else's
# code, and an SBOM that silently omits the engine that builds every image is worse than no
# SBOM at all.
#
# DELIBERATELY NOT HERE: signing. cosign sits on CLAUDE.md's target list, but the signing
# key is generated by a human, not by a tool that logs (CLAUDE.md §5 / §10.3), so a signing
# step in this file would either be dead or would need a key this repo must not hold. It is
# named here rather than quietly omitted.
name: sbom

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # release-please (or a human) creating the Release is the trigger that can *prove* the
  # release object exists. A mirrored tag arriving from GitLab usually predates it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        # The backfill path for C-14: name a tag that shipped without an SBOM and the
        # documents are generated from that tree and attached to that tag's Release. Blank
        # generates from the current branch and attaches nothing. A value that is not a
        # release tag fails the attach job rather than guessing.
        description: "Release tag to generate and attach an SBOM for, e.g. v0.2.0 (blank = this branch, no attach)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch runs are pointless; a tag or release run is not repeatable on demand
  # and must never be cancelled by a later push.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # ─────────────────────────────  CycloneDX (cargo)  ─────────────────────────────
  cyclonedx:
    name: cyclonedx (both manifests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          # audit, not block: this job legitimately reaches crates.io *and* the git
          # dependencies the vendored root manifest pins (gitlab.redox-os.org, github.com).
          # A block list nobody has measured would fail this job for the wrong reason; audit
          # records the endpoints so the list can later be written from data, not guesswork.
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag }} # empty on every trigger except the backfill dispatch
          persist-credentials: false

      - name: Install the pinned toolchain
        # `rust-toolchain.toml` pins nightly-2026-05-24. `rustup toolchain install` with no
        # argument installs exactly what that file names, so the SBOM describes the graph the
        # pinned compiler resolves rather than whatever the runner image happens to ship.
        # There is no toolchain matrix here for the same reason: the pin is the answer, and a
        # matrix would quietly ignore it.
        # No dtolnay/rust-toolchain step: the ubuntu image already carries rustup, and an
        # action that installs `stable` would only add a compiler nothing in this repo uses.
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - name: Install cargo-cyclonedx
        # From crates.io, built from source, `--locked`: cargo verifies the .crate checksum
        # against the registry index, which is the chain cargo-deny's *binary* release does
        # not have — hence the sha256 pin on that one (U-118) and not on this one.
        #
        # Deliberately NOT restored from an Actions cache. This binary is what produces the
        # document the rest of the supply chain reads; putting a writable cache in its trust
        # path to save a few minutes is the wrong trade in this repo.
        #
        # Left undone, on purpose and in the open: the version is not pinned. The GitLab
        # `sbom` job does not pin it either. Pinning it (with the same bump procedure U-118
        # documents for cargo-deny) is the next step, not something to invent here.
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --version

      - name: Generate CycloneDX for both manifests
        # Mirrors the GitLab `sbom` job step for step: E-OS-owned tool first, vendored root
        # engine second, then collect. `-not -path './sbom/*'` keeps the committed 0.1.0
        # image documents out of the freshly generated set.
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path tools/eos-repo-sign/Cargo.toml --format json
          cargo cyclonedx --manifest-path Cargo.toml --format json
          mkdir -p sbom-out
          find . -name '*.cdx.json' -not -path './sbom/*' -not -path './sbom-out/*' -exec cp {} sbom-out/ \;
          ls -la sbom-out/

      - name: Assert both documents exist and are non-trivial
        # `find | cp` cannot fail this job on its own. If cargo-cyclonedx changes its output
        # name or one manifest silently resolves to nothing, the run stays green and ships an
        # empty artifact — "the document quietly stopped being produced" is the exact shape of
        # C-14. Two manifests in, two documents out, each with at least one component.
        run: |
          set -euo pipefail
          count=$(find sbom-out -name '*.cdx.json' | wc -l | tr -d ' ')
          echo "CycloneDX documents produced: ${count}"
          if [ "${count}" -lt 2 ]; then
            echo "expected one CycloneDX document per manifest (2), got ${count}" >&2
            exit 1
          fi
          for f in sbom-out/*.cdx.json; do
            python3 - "$f" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              bom = json.load(fh)
          n = len(bom.get("components", []))
          print(f"{path}: bomFormat={bom.get('bomFormat')} specVersion={bom.get('specVersion')} components={n}")
          if bom.get("bomFormat") != "CycloneDX" or n == 0:
              sys.exit(f"{path}: not a CycloneDX document with components")
          PY
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom-out/*.cdx.json
          if-no-files-found: error
          # 90 days is the public-repo maximum. It is a convenience window for diffing
          # builds, NOT the answer to C-14 — durability comes from the release asset below.
          retention-days: 90

  # ────────────────────────────────  SPDX (syft)  ────────────────────────────────
  spdx:
    name: spdx (syft, whole tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Prepare the output directory
        run: mkdir -p sbom-out

      # A second document, in the other format, produced by a different tool over the whole
      # checked-out tree instead of through cargo's resolver. Two reasons it is not a
      # duplicate of the CycloneDX pair: anything downstream that consumes SPDX and not
      # CycloneDX got nothing before this, and syft catalogues every manifest it recognises
      # rather than only the two Cargo.lock files — so the two formats also cross-check each
      # other on the Rust dependencies they both see.
      - name: Generate SPDX with syft
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          path: .
          format: spdx-json
          output-file: sbom-out/eos-source.spdx.json
          # Both off on purpose. This job scans the working tree and so runs with the
          # top-level read-only token; the release write lives in `attach`, which touches no
          # repository content. Letting the action upload the asset itself would need
          # `contents: write` right here, in the job that runs a cataloguer over untrusted
          # PR content.
          upload-artifact: false
          upload-release-assets: false

      - name: Assert the document exists and is non-trivial
        run: |
          set -euo pipefail
          f=sbom-out/eos-source.spdx.json
          test -s "$f"
          python3 - "$f" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              doc = json.load(fh)
          n = len(doc.get("packages", []))
          print(f"{path}: spdxVersion={doc.get('spdxVersion')} packages={n}")
          if not str(doc.get("spdxVersion", "")).startswith("SPDX-") or n == 0:
              sys.exit(f"{path}: not an SPDX document with packages")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx
          path: sbom-out/eos-source.spdx.json
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────  attach to the GitHub Release  ─────────────────────
  # The half that actually closes C-14. Runs only for a tag, a published Release, or an
  # explicit backfill dispatch. It downloads the documents the two jobs above produced and
  # uploads them as release assets, which outlive every artifact retention window.
  attach:
    name: attach to release
    needs: [cyclonedx, spdx]
    if: >-
      github.event_name == 'release'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only escalation in this file, in the only job that needs it. This job never
      # checks out the tree and never runs a build tool: it moves files that were produced
      # under a read-only token.
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: sbom-*
          merge-multiple: true
          path: dist

      - name: Resolve and check the tag
        # The tag is the one value here that comes from outside this file, so it arrives
        # through `env` (never interpolated into the script), is quoted at every use, and is
        # shape-checked before it is ever handed to `gh`.
        #
        # The shape check is a bash `[[ =~ ]]` and NOT `grep -qE`, which is what this was
        # first written as. grep matches line by line: a `workflow_dispatch` input of
        # $'v1.0.0\ntag=../../etc' has a first line that satisfies the pattern, so grep
        # returns 0 — and the `echo` below then writes BOTH lines into `$GITHUB_OUTPUT`,
        # where the second one is parsed as its own `tag=` output and the last value wins.
        # The guard would have approved `v1.0.0` and handed `../../etc` to the step that
        # holds the only `contents: write` token in this file. `[[ =~ ]]` anchors on the
        # whole string and its bracket expressions never match a newline, so the multi-line
        # value is refused outright. A git ref cannot contain a newline; a dispatch input can.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            release)           tag="${RELEASE_TAG}" ;;
            workflow_dispatch) tag="${INPUT_TAG}" ;;
            *)                 tag="${REF_NAME}" ;;
          esac
          if [[ ! "${tag}" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            # %q, not %s: a rejected value can contain anything, and the log line that
            # explains the refusal should not be the place it gets to hide.
            printf 'refusing to use %q as a release tag: expected vX.Y.Z\n' "${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        id: tag

      - name: Upload the SBOMs as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Three documents in, three out: two CycloneDX (one per manifest) and one SPDX.
          # download-artifact will not fail on a partial set, and a release carrying half an
          # SBOM is the kind of thing nobody notices until an audit asks.
          found=$(find dist -type f | wc -l | tr -d ' ')
          echo "documents downloaded: ${found}"
          if [ "${found}" -ne 3 ]; then
            echo "expected 3 SBOM documents from the cyclonedx and spdx jobs, found ${found}" >&2
            find dist -type f >&2 || true
            exit 1
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "${EVENT_NAME}" = "push" ]; then
              # Expected, and not a failure: GitLab is the source of truth and mirrors tags
              # to GitHub before any Release object exists. The `release: published` trigger
              # runs this same job the moment the Release is cut, and the documents are also
              # sitting in this run's artifacts. This workflow does not create Releases —
              # that belongs to whatever cuts them, not to the job that describes them.
              echo "no GitHub Release for ${TAG} yet; the release:published run will attach"
              exit 0
            fi
            # A release event or an operator-requested backfill named a tag with no Release.
            # Failing loudly is the point: a silent no-op here is how C-14 happened.
            echo "no GitHub Release found for ${TAG}" >&2
            exit 1
          fi
          # Name every asset after the tag it describes. The committed image documents use
          # eos-<ver>-<arch>.cdx.json; these are host-tooling documents, so they carry the
          # tag and the crate/tool name instead and cannot be mistaken for an image closure.
          mkdir -p upload
          for f in dist/*; do
            [ -f "$f" ] || continue
            cp "$f" "upload/eos-${TAG}-$(basename "$f")"
          done
          ls -la upload/
          gh release upload "${TAG}" upload/* --clobber

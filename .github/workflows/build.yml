name: Build image (experimental)

# Best-effort full E-OS image build in CI. MANUAL trigger only — a full Redox build
# is heavy (toolchain + Podman + FUSE + minutes-to-hours). The canonical build is
# local; see docs/building.md. This proves the pipeline and produces an artifact
# when the runner cooperates.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        default: x86_64
        type: choice
        options: [x86_64, aarch64]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - name: System setup (Podman, FUSE, build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y podman crun fuse3 libfuse2t64 qemu-utils \
            build-essential curl git nasm autoconf automake libtool flex bison \
            ninja-build meson pkg-config gperf po4a doxygen || \
          sudo apt-get install -y podman crun fuse3 qemu-utils build-essential \
            curl git nasm autoconf automake libtool flex bison ninja-build meson pkg-config gperf
          sudo modprobe fuse || true
          ls -l /dev/fuse || true

      - name: Rust toolchain
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure (Podman build, binary fast-path)
        run: printf 'PODMAN_BUILD?=1\nREPO_BINARY?=1\n' > .config

      - name: Build host fstools
        run: |
          . "$HOME/.cargo/env"
          make CI=1 ARCH=${{ inputs.arch }} fstools

      - name: Force E-OS forks from source, then build the image
        # ALL SIX forks, not just the branding three: on a fresh clone with
        # REPO_BINARY=1 the resolver has no local source_info.toml to compare,
        # so pinned-source recipes silently resolve to UPSTREAM binaries —
        # shipping an image without the R-401* kernel/base fixes (aarch64
        # would not even boot) or the R-402a relibc TLS fix (both arches).
        run: |
          . "$HOME/.cargo/env"
          make CI=1 ARCH=${{ inputs.arch }} CONFIG_NAME=eos \
            scr.kernel scr.base scr.relibc \
            scr.bootloader scr.userutils scr.orbdata
          make CI=1 ARCH=${{ inputs.arch }} CONFIG_NAME=eos all

      - name: Verify E-OS branding in the image
        run: |
          IMG="build/${{ inputs.arch }}/eos/harddrive.img"
          echo "eos login:      $(strings "$IMG" | grep -c 'eos login:')"
          echo "E-OS Bootloader: $(strings "$IMG" | grep -c 'E-OS Bootloader')"
          echo "redox login:    $(strings "$IMG" | grep -c 'redox login:')"

      - name: Verify the six forks were packaged from their pinned sources
        # Each repo/<target>/<pkg>.toml records the source_identifier the package
        # was actually built from; it must match the recipe's pinned fork rev
        # (rev for the rev-pinned recipes, the fetched source HEAD otherwise).
        run: |
          T="${{ inputs.arch }}-unknown-redox"
          fail=0
          for entry in core/kernel core/base core/relibc core/userutils core/bootloader gui/orbdata; do
            pkg=$(basename "$entry")
            want=$(git -C "recipes/$entry/source" rev-parse HEAD 2>/dev/null || \
                   sed -n 's/^rev *= *"\(.*\)"/\1/p' "recipes/$entry/recipe.toml")
            got=$(sed -n 's/^source_identifier *= *"\(.*\)"/\1/p' "repo/$T/$pkg.toml")
            printf '%-12s want=%.12s got=%.12s\n' "$pkg" "$want" "$got"
            case "$got" in
              "${want:0:12}"*) ;;                      # matches the pinned rev
              *) echo "MISMATCH: $pkg was not packaged from its pinned fork"; fail=1 ;;
            esac
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eos-${{ inputs.arch }}-harddrive
          path: build/*/eos/harddrive.img
          if-no-files-found: warn

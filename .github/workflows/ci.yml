name: CI

on:
  push:
    branches: [main, eos-base]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required project files present
        run: |
          missing=0
          for f in README.md LICENSE NOTICE SECURITY.md CODE_OF_CONDUCT.md \
                   CONTRIBUTING.md CHANGELOG.md ROADMAP.md \
                   licenses/Redox-OS-MIT.txt; do
            if [ ! -f "$f" ]; then echo "::error::missing $f"; missing=1; fi
          done
          [ "$missing" = 0 ] && echo "All required files present."
          exit $missing

      - name: License is AGPL-3.0
        run: |
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE \
            && echo "LICENSE is AGPL-3.0" \
            || { echo "::error::LICENSE is not AGPL-3.0"; exit 1; }

      - name: Shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -name '*.sh' -not -path './build/*' -not -path './prefix/*' \
            -print0 | xargs -0 -r shellcheck -S warning || true

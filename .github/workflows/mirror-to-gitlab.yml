name: Mirror to GitLab

# Keeps the GitLab mirror (gitlab.com/Gh0s777tt/<repo>) in step with GitHub on
# every push. GitLab free tier cannot pull-mirror, so GitHub pushes here instead.
# Requires the repo/org secret GITLAB_TOKEN (a GitLab token with write_repository).

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Push all branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::error::GITLAB_TOKEN secret is not set — add a GitLab write_repository token."
            exit 1
          fi
          # GitLab path is lowercase (E-OS -> e-os; eos-* unchanged).
          name="$(echo "${GITHUB_REPOSITORY##*/}" | tr 'A-Z' 'a-z')"
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          # Force so the mirror tracks GitHub exactly, even after a rebase/force-push.
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Gh0s777tt/${name}.git" \
            "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
          echo "Mirrored ${GITHUB_REPOSITORY} -> gitlab.com/Gh0s777tt/${name}"

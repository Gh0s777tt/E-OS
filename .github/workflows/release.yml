name: Release

# Publishes integrity artifacts for an E-OS release on tag push.
# The OS images themselves are built locally (Podman + toolchain; see docs/building.md)
# and uploaded to the release; this workflow attaches the committed checksums + SBOM,
# and signs the checksums with minisign when a MINISIGN_SECRET_KEY secret is configured.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sign SHA256SUMS (minisign, if key configured)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_SECRET_KEY" ] && [ -f release/SHA256SUMS ]; then
            sudo apt-get update && sudo apt-get install -y minisign
            printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/eos-minisign.key
            minisign -S -s /tmp/eos-minisign.key -m release/SHA256SUMS -x release/SHA256SUMS.minisig
            rm -f /tmp/eos-minisign.key
            echo "Signed release/SHA256SUMS -> release/SHA256SUMS.minisig"
          else
            echo "No MINISIGN_SECRET_KEY secret (or no SHA256SUMS) - skipping signing."
          fi

      - name: Publish release with checksums + SBOM
        uses: softprops/action-gh-release@v2
        with:
          name: E-OS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/SHA256SUMS
            release/SHA256SUMS.minisig
            sbom/*.cdx.json
          body: |
            ## E-OS ${{ github.ref_name }}

            Attached: **SHA256SUMS** (image checksums) and a **CycloneDX SBOM** per architecture.
            OS images (`eos-*-x86_64.img`, `eos-*-aarch64.img`) are built locally — see
            [docs/building.md](https://github.com/Gh0s777tt/E-OS/blob/main/docs/building.md) —
            and should be uploaded to this release. Verify with `sha256sum -c SHA256SUMS`
            (and `minisign -Vm SHA256SUMS -P <eos pubkey>` if signed).

            Built on Redox OS · AGPL-3.0.

name: cargo-audit

on:
  schedule:
    - cron: '0 7 * * 1'   # weekly, Monday 07:00 UTC
  workflow_dispatch:
  push:
    paths:
      - '**/Cargo.lock'
      - '.github/workflows/cargo-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: RustSec advisory scan (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # inherited upstream advisories shouldn't block CI
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Audit root Cargo.lock
        run: |
          if [ -f Cargo.lock ]; then
            cargo audit --file Cargo.lock || true
          else
            echo "No root Cargo.lock; skipping."
          fi

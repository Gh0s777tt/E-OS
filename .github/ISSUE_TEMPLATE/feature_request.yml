name: ✨ Feature / Roadmap request
description: Suggest an idea or a roadmap item for E-OS
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [ROADMAP](https://github.com/Gh0s777tt/E-OS/blob/main/ROADMAP.md) first —
        your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do? What's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [branding/identity, build/tooling, security/hardening, drivers/hardware, desktop, docs, other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
          required: false

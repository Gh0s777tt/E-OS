name: Question
description: Ask about building, installing or using E-OS
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before asking, please check [`docs/getting-started/faq.md`](../../docs/getting-started/faq.md)
        and [`docs/reference/known-issues.md`](../../docs/reference/known-issues.md).

        **Do not use this template for security issues** — see [`SECURITY.md`](../../SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Building, Installing, Package management, Desktop, Hardware, Security, Contributing, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: E-OS version
      description: "Output of `eos info`, or the tag/commit you built from"
  - type: textarea
    id: tried
    attributes:
      label: What you have already tried

# cargo-deny supply-chain policy for E-OS host tooling (ETAP 4 / R-005).
# Run: cargo deny --manifest-path tools/eos-repo-sign/Cargo.toml check

[advisories]
version = 2
yanked = "deny"
# ignore = []   # add RUSTSEC-ids here only with a justification comment

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

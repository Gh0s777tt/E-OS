[package]
name = "redox_cookbook"
version = "0.1.0"
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
edition = "2024"
default-run = "repo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "cookbook_redoxer"
path = "src/bin/cookbook_redoxer.rs"

[[bin]]
name = "repo"
path = "src/bin/repo.rs"

[[bin]]
name = "repo_builder"
path = "src/bin/repo_builder.rs"

[lib]
name = "cookbook"
path = "src/lib.rs"
doctest = false

[features]
#TODO: Actually make without tui feature works
default = ["tui"]
tui = ["ratatui", "ansi-to-tui", "strip-ansi-escapes"]

[dependencies]
blake3 = "1"
globset = "0.4"
libc = "0.2"
ignore = "0.4"
object = { version = "0.38", features = ["build_core"] }
pkgar = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git" }
pkgar-core = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git" }
pkgar-keys = { git = "https://gitlab.redox-os.org/redox-os/pkgar.git" }
# E-OS V2-MS15: pinned to the E-OS fork, not upstream. The host tools built from this
# manifest include repo_builder, which WRITES repo.toml, while the client that READS it is
# built from recipes/core/pkgutils -- the fork. Leaving this on upstream meant the producer
# and the consumer of the manifest were different codebases, so a field added on one side
# simply did not exist on the other. Pinned by rev for the same reason every other fork is.
redox-pkg = { git = "https://github.com/Gh0s777tt/eos-pkgutils.git", rev = "e28063ee2f6ffee19322dedaf2d0e4ab737feb75", default-features = false }
redox_installer = { git = "https://gitlab.redox-os.org/redox-os/installer.git", default-features = false }
redoxer = { git = "https://gitlab.redox-os.org/redox-os/redoxer.git", default-features = false }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
termion = "4"
toml = "0.8"
walkdir = "2.3.1"
ansi-to-tui = { version = "8", optional = true }
strip-ansi-escapes = { version = "0.2.1", optional = true }
serde_json = "1"

[dependencies.ratatui]
version = "0.30"
default-features = false
features = ["termion"]
optional = true

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2A33"/>
      <stop offset="1" stop-color="#B00610"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="17%" r="50%">
      <stop offset="0" stop-color="#E50914" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#E50914" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1024" height="768" fill="url(#bg)"/>
  <rect width="1024" height="768" fill="url(#grid)"/>
  <rect width="1024" height="768" fill="url(#glow)"/>

  <!-- hex logo + E wordmark, top (centre kept clear for the login form) -->
  <g transform="translate(512,140)">
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31"
             fill="none" stroke="url(#red)" stroke-width="6" stroke-linejoin="round"/>
    <g fill="#FFFFFF" transform="translate(-23,-31)">
      <rect x="0" y="0" width="46" height="11" rx="2"/>
      <rect x="0" y="0" width="11" height="62" rx="2"/>
      <rect x="0" y="25" width="36" height="10" rx="2"/>
      <rect x="0" y="51" width="46" height="11" rx="2"/>
    </g>
    <circle cx="0" cy="0" r="2.2" fill="#E50914"/>
  </g>

  <text x="512" y="256" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF" letter-spacing="4">E<tspan fill="#E50914">-</tspan>OS</text>
  <rect x="460" y="273" width="104" height="4" rx="2" fill="url(#red)"/>

  <!-- footer -->
  <text x="512" y="692" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#8a9097">AGPL-3.0   .   built on Redox OS   .   v0.1.0 "Genesis"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="E-OS banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A33"/>
      <stop offset="1" stop-color="#B00610"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#E50914" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E50914" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- hex mark -->
  <g transform="translate(150,320)">
    <polygon points="0,-92 80,-46 80,46 0,92 -80,46 -80,-46"
             fill="none" stroke="url(#red)" stroke-width="9" stroke-linejoin="round"/>
    <g fill="#FFFFFF" transform="translate(-34,-46)">
      <rect x="0" y="0" width="70" height="16" rx="3"/>
      <rect x="0" y="0" width="16" height="92" rx="3"/>
      <rect x="0" y="38" width="54" height="16" rx="3"/>
      <rect x="0" y="76" width="70" height="16" rx="3"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="300" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="170" font-weight="800" fill="#FFFFFF" letter-spacing="2">E<tspan fill="#E50914">-</tspan>OS</text>
  <text x="306" y="372" font-family="Fira Code, Consolas, monospace" font-size="34" fill="#E50914" letter-spacing="1">The Rust-native operating system</text>

  <!-- footer tags -->
  <g font-family="Fira Code, Consolas, monospace" font-size="22" fill="#9aa0a6">
    <text x="306" y="452">microkernel · COSMIC desktop · capability-secure</text>
    <text x="306" y="486" fill="#E50914">AGPL-3.0  ·  built on Redox OS  ·  v0.1.0 “Genesis”</text>
  </g>

  <rect x="0" y="632" width="1280" height="8" fill="url(#red)"/>
</svg>
